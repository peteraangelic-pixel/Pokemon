name: Download Demo Games

on:
  workflow_dispatch:
  push:
    branches: ["arena/7911f950-pokemon"]
    paths:
      - "arc-agi-3/.download-games.trigger"

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install Kaggle CLI
        run: pip install kaggle
      
      - name: Configure Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p .kaggle
          printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]' > .kaggle/access_token
          chmod 600 .kaggle/access_token
      
      - name: Download competition data
        run: |
          export KAGGLE_API_TOKEN=$(cat .kaggle/access_token)
          
          mkdir -p /tmp/arc-data
          cd /tmp/arc-data
          
          echo "=== Downloading arc-prize-2026-arc-agi-3 ==="
          kaggle competitions data -c arc-prize-2026-arc-agi-3 -p . 2>&1 | tee download-log.txt
          
          echo -e "\n=== Files downloaded ==="
          ls -lah
          
          # Unzip if needed
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Unzipping $f..."
              unzip -q "$f" -d "${f%.zip}"
            fi
          done
          
          # Find game files
          echo -e "\n=== Looking for game/demo files ==="
          find . -type f -name "*.py" -o -name "*.json" | grep -iE "(game|demo|environment)" | head -30 | tee games-list.txt
          
          echo -e "\n=== All Python files ==="
          find . -type f -name "*.py" | head -50 | tee python-files.txt
          
          echo -e "\n=== All JSON files ==="
          find . -type f -name "*.json" | head -50 | tee json-files.txt
      
      - name: Announce
        if: always()
        run: |
          {
            echo "=== Download Log ==="
            cat /tmp/arc-data/download-log.txt 2>/dev/null
            echo -e "\n=== Files ==="
            ls -lah /tmp/arc-data/ 2>/dev/null
            echo -e "\n=== Games List ==="
            cat /tmp/arc-data/games-list.txt 2>/dev/null
          } > /tmp/download-report.txt
          
          python3 - <<'PY'
          body = open('/tmp/download-report.txt').read()
          body = body.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(f"::notice title=Download Result::{body[:4500]}")
          PY
