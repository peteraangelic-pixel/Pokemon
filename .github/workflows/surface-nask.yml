name: NASK surface

# Project: NASK bug-bounty (hack.cert.pl, edition 11/2026, 2026-11-03..30).
# The tool lives in nask/tools/surface.
#
#   ci        compile + unit tests + offline selftest. Never touches the network.
#   discover  manual only (workflow_dispatch). Read-only GET against the published
#             scope at <=5 req/s (programme limit), then offline Rayon analysis.
on:
  push:
    branches: [arena/7911f950-pokemon]
    paths:
      - "nask/tools/surface/**"
      - ".github/workflows/surface-nask.yml"
  workflow_dispatch:
    inputs:
      rps:
        description: "requests per second (hard cap 5, default 4)"
        default: "4"
        required: false
      assets:
        description: "max same-origin assets per host"
        default: "40"
        required: false

permissions:
  contents: read

# One network coordinator for the repository: two concurrent runs would otherwise
# add up to more than the programme's 5 req/s.
concurrency:
  group: nask-surface-network-coordinator
  cancel-in-progress: false

env:
  MANIFEST: nask/tools/surface/Cargo.toml
  BIN: nask/tools/surface/target/release/surface

jobs:
  ci:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests (no network)
        run: cargo test --manifest-path "$MANIFEST"
      - name: Build
        run: cargo build --release --manifest-path "$MANIFEST"
      - name: Offline selftest (guard, limiter, analyzer)
        run: ./"$BIN" selftest
      - name: Scope table
        run: ./"$BIN" scope

  discover:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests gate the network run
        run: cargo test --manifest-path "$MANIFEST"
      - name: Build
        run: cargo build --release --manifest-path "$MANIFEST"
      - name: Offline selftest gate
        run: ./"$BIN" selftest
      - name: Discovery (read-only GET, <=5 req/s)
        run: |
          ./"$BIN" run --out nask/out \
            --rps "${{ inputs.rps }}" \
            --assets "${{ inputs.assets }}"
      - name: Offline analysis (rayon)
        run: ./"$BIN" analyze --dir nask/out
      - name: Per-host table in the log
        run: |
          python3 - <<'PY'
          import json
          a = json.load(open("nask/out/analysis.json"))
          print(f"{'host':<34}{'docs':>6}{'js':>5}{'routes':>8}  frameworks")
          for h, v in a["per_host"].items():
              print(f"{h:<34}{v['documents']:>6}{v['js_documents']:>5}{v['route_literals']:>8}  {','.join(v['frameworks'])}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nask-surface-${{ github.run_id }}
          path: |
            nask/out/index.json
            nask/out/analysis.json
            nask/out/bodies/
          if-no-files-found: error
          retention-days: 14
