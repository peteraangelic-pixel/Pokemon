name: kaggle-poll

# Read our submission status and leaderboard rating from Kaggle.
#
# The agent sandbox has no route to kaggle.com, so it cannot ask Kaggle
# anything itself. GitHub Actions runners do have unrestricted internet, so the
# fetch happens here and the result is committed back to the branch -- where the
# agent reads it with a plain `git pull`.
#
# The agent also cannot read Actions logs: the log host
# (results-receiver.actions.githubusercontent.com) is outside the sandbox's
# allowed hosts, and listing secrets is 403 for the integration token. So the
# workflow reports its own state by COMMITTING it to kaggle_results/ -- that is
# the only channel the agent can actually read.
#
# HOW TO RUN IT
#   touch kaggle_results/poll.trigger && git add -A && git commit -m "poll" && git push
#     (the path filter below fires on that file; no `if:` expression needed)
#   gh workflow run kaggle-poll --ref <branch>   (needs a PAT; the GitHub App
#                                                 token gets 403 on dispatch)
#   the cron below, once this file is on the default branch.
#
# REQUIRED SETUP (once, by you -- never paste these into chat)
#   Kaggle -> Settings -> API -> Create New Token
#   Repo -> Settings -> Secrets and variables -> Actions -> New repository secret
#     EITHER  KAGGLE_API_TOKEN   the token alone (preferred; simplest)
#     OR      KAGGLE_USERNAME + KAGGLE_KEY
#   Optional repo *variable* (not secret):
#     KAGGLE_TEAM   your team name, to pick your row out of the leaderboard

on:
  workflow_dispatch:
    inputs:
      competition:
        description: "Kaggle competition slug"
        required: false
        default: "the-pokemon-company-ptcg-ai-battle-challenge-playground"
  push:
    branches: ["arena/c87f7a48-pokemon"]
    paths:
      - "pokemon-agent/kaggle_results/poll.trigger"
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install kaggle CLI
        run: pip install --quiet kaggle

      - name: Configure Kaggle credentials
        id: auth
        continue-on-error: true
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -e
          RES=pokemon-agent/kaggle_results
          mkdir -p "$RES"
          {
            echo "## run diagnostics"
            echo ""
            echo "run_id: ${{ github.run_id }}   attempt: ${{ github.run_attempt }}"
            echo "event: ${{ github.event_name }}"
            echo "ref: ${{ github.ref_name }}"
            echo "utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "credentials present (names only, never values):"
            echo "- KAGGLE_API_TOKEN: $([ -n "$KAGGLE_API_TOKEN" ] && echo YES || echo 'not set')"
            echo "- KAGGLE_USERNAME:  $([ -n "$KAGGLE_USERNAME" ] && echo YES || echo 'not set')"
            echo "- KAGGLE_KEY:       $([ -n "$KAGGLE_KEY" ] && echo YES || echo 'not set')"
          } > "$RES/poll_diagnostics.md"

          mkdir -p ~/.kaggle
          if [ -n "$KAGGLE_API_TOKEN" ]; then
            printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]' > ~/.kaggle/access_token
            chmod 600 ~/.kaggle/access_token
            echo "" >> "$RES/poll_diagnostics.md"
            echo "auth: KAGGLE_API_TOKEN -> ~/.kaggle/access_token" >> "$RES/poll_diagnostics.md"
          elif [ -n "$KAGGLE_USERNAME" ] && [ -n "$KAGGLE_KEY" ]; then
            python3 - "$KAGGLE_USERNAME" "$KAGGLE_KEY" <<'PY'
          import json, os, sys
          path = os.path.expanduser("~/.kaggle/kaggle.json")
          json.dump({"username": sys.argv[1], "key": sys.argv[2]}, open(path, "w"))
          os.chmod(path, 0o600)
          PY
            echo "" >> "$RES/poll_diagnostics.md"
            echo "auth: KAGGLE_USERNAME/KEY -> ~/.kaggle/kaggle.json" >> "$RES/poll_diagnostics.md"
          else
            echo "" >> "$RES/poll_diagnostics.md"
            echo "**auth: FAILED - no credentials found.**" >> "$RES/poll_diagnostics.md"
            echo "Add a repository secret named KAGGLE_API_TOKEN" >> "$RES/poll_diagnostics.md"
            echo "(Settings -> Secrets and variables -> Actions -> New repository secret)." >> "$RES/poll_diagnostics.md"
            exit 1
          fi

      - name: Fetch submissions + leaderboard
        id: fetch
        continue-on-error: true
        env:
          KAGGLE_TEAM: ${{ vars.KAGGLE_TEAM }}
        run: |
          python pokemon-agent/tools/fetch_kaggle_results.py \
            --competition "${{ inputs.competition || 'the-pokemon-company-ptcg-ai-battle-challenge-playground' }}" \
            || echo "fetch step failed (see summary.json for problems)" \
               >> pokemon-agent/kaggle_results/poll_diagnostics.md

      - name: Surface the result in the job log
        if: always()
        run: |
          if [ -f pokemon-agent/kaggle_results/summary.md ]; then
            cat pokemon-agent/kaggle_results/summary.md
          else
            echo "no summary produced -- see the fetch step above"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaggle-results
          path: pokemon-agent/kaggle_results/
          if-no-files-found: warn

      - name: Commit results back to the branch
        if: always()
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          if [ -n "$(git status --porcelain pokemon-agent/kaggle_results)" ]; then
            git add pokemon-agent/kaggle_results
            git commit -m "chore(kaggle): poll results [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "committed fresh results"
          else
            echo "results unchanged, nothing to commit"
          fi
