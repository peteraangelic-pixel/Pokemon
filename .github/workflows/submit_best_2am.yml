name: submit-best-2am (DISARMED — manual only, no auto, plus push trigger)

on:
  workflow_dispatch:
    inputs:
      agent:
        description: "Agent to submit"
        default: "agents/v70_alakazam_endgame.py"
        required: false
      deck:
        description: "Deck csv"
        default: "decks/v66_alakazam_simple.csv"
        required: false
      name:
        description: "Bundle name (must be distinct!)"
        default: "v70_alakazam_endgame_632"
        required: false
      message:
        description: "Submission message"
        default: "v70 endgame bench guard >=2, recovery, no last Abra — fixes 0.15->0.50 vs Mengfei wall, 0.632 broad"
        required: false
  push:
    branches:
      - arena/c87f7a48-pokemon
    paths:
      - pokemon-agent/kaggle_results/submit_2am.trigger

permissions:
  contents: write

concurrency:
  group: pokemon-submit-best-${{ github.ref }}
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install kaggle
        run: python -m pip install --disable-pip-version-check --quiet kaggle
      - name: Configure Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
      - name: Build bundle
        run: |
          cd pokemon-agent
          AGENT="${{ inputs.agent }}"
          DECK="${{ inputs.deck }}"
          NAME="${{ inputs.name }}"
          MSG="${{ inputs.message }}"
          if [ -z "$AGENT" ] || [ "$AGENT" = "" ]; then
            if [ -f "kaggle_results/submit_2am.trigger" ]; then
              cat kaggle_results/submit_2am.trigger
              if grep -q "|" kaggle_results/submit_2am.trigger; then
                AGENT=$(cut -d'|' -f1 kaggle_results/submit_2am.trigger)
                DECK=$(cut -d'|' -f2 kaggle_results/submit_2am.trigger)
                NAME=$(cut -d'|' -f3 kaggle_results/submit_2am.trigger)
                MSG=$(cut -d'|' -f4- kaggle_results/submit_2am.trigger)
              else
                AGENT=$(sed -n '1p' kaggle_results/submit_2am.trigger)
                DECK=$(sed -n '2p' kaggle_results/submit_2am.trigger)
                NAME=$(sed -n '3p' kaggle_results/submit_2am.trigger)
                MSG=$(sed -n '4p' kaggle_results/submit_2am.trigger)
              fi
            fi
          fi
          [ -z "$AGENT" ] && AGENT="agents/v70_alakazam_endgame.py"
          [ -z "$DECK" ] && DECK="decks/v66_alakazam_simple.csv"
          [ -z "$NAME" ] && NAME="v70_alakazam_endgame_632"
          [ -z "$MSG" ] && MSG="v70 endgame bench guard >=2"
          echo "AGENT=$AGENT DECK=$DECK NAME=$NAME MSG=$MSG"
          mkdir -p /tmp/bundle
          cp "$AGENT" /tmp/bundle/main.py
          cp "$DECK" /tmp/bundle/deck.csv
          cp assets/card_index.json /tmp/bundle/card_index.json
          tar -czvf "bundles/${NAME}.tar.gz" -C /tmp/bundle main.py deck.csv card_index.json
          ls -lh "bundles/${NAME}.tar.gz"
          echo "AGENT=$AGENT" >> $GITHUB_ENV
          echo "DECK=$DECK" >> $GITHUB_ENV
          echo "BUNDLE_NAME=$NAME" >> $GITHUB_ENV
          echo "BUNDLE_MSG=$MSG" >> $GITHUB_ENV
      - name: Submit to Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          cd pokemon-agent
          NAME="${{ env.BUNDLE_NAME }}"
          if [ -z "$NAME" ]; then NAME="${{ inputs.name }}"; fi
          MSG="${{ env.BUNDLE_MSG }}"
          if [ -z "$MSG" ]; then MSG="${{ inputs.message }}"; fi
          echo "Submitting $NAME with msg $MSG"
          kaggle competitions submit -c the-pokemon-company-ptcg-ai-battle-challenge-playground -f "bundles/${NAME}.tar.gz" -m "$MSG" 2>&1 | tee kaggle_results/submit_2am.log
          if grep -q "Successfully submitted" kaggle_results/submit_2am.log; then
            echo "Submit reported success"
            echo "Submitted $NAME" | tee -a kaggle_results/submit_2am.log
            exit 0
          else
            echo "Submit failed"
            cat kaggle_results/submit_2am.log
            exit 1
          fi
      - name: Commit log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f pokemon-agekaggle_results/submit_2am.log pokemon-agent/bundles/ || true
          git commit -m "submit log ${{ github.run_id }} [skip ci]" || echo "no changes"
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
