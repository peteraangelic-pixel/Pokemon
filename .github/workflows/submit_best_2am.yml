name: submit-best-2am
on:
  workflow_dispatch:
    inputs:
      agent:
        description: "Agent to submit"
        default: "agents/main_heuristic_v61_merged.py"
        required: false
      name:
        description: "Bundle name"
        default: "v61_heuristic_merged"
        required: false
      message:
        description: "Submission message"
        default: "v61 heuristic merged c87_v44 + wall guard Kyogre, bench guard 1000, all bugs fixed"
        required: false

permissions:
  contents: write

concurrency:
  group: pokemon-submit-best-${{ github.ref }}
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check --quiet kaggle
      - name: Configure Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          if [ -n "${KAGGLE_API_TOKEN:-}" ]; then
            printf '%s' "$KAGGLE_API_TOKEN" | tr -d '\r\n' > ~/.kaggle/access_token
            chmod 600 ~/.kaggle/access_token
          elif [ -n "${KAGGLE_USERNAME:-}" ] && [ -n "${KAGGLE_KEY:-}" ]; then
            printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
            chmod 600 ~/.kaggle/kaggle.json
          else
            echo "no creds"; exit 1
          fi
      - name: Build bundle
        run: |
          cd pokemon-agent
          AGENT="${{ inputs.agent }}"
          NAME="${{ inputs.name }}"
          echo "Building $AGENT as $NAME"
          ls -lh $AGENT deck.csv assets/card_index.json
          python build_submission.py --agent $AGENT --name $NAME
          ls -lh bundles/${NAME}.tar.gz
      - name: Submit
        env:
          BUNDLE_NAME: ${{ inputs.name }}
          MESSAGE: ${{ inputs.message }}
        run: |
          cd pokemon-agent
          BUNDLE="bundles/${BUNDLE_NAME}.tar.gz"
          kaggle competitions submit -c the-pokemon-company-ptcg-ai-battle-challenge-playground -f $BUNDLE -m "$MESSAGE" 2>&1 | tee kaggle_results/submit_2am.log
          kaggle competitions submissions -c the-pokemon-company-ptcg-ai-battle-challenge-playground -v 2>&1 | head -100 | tee -a kaggle_results/submit_2am.log
      - name: Commit log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/keep && mkdir -p /tmp/keep
          cp -r pokemon-agent/kaggle_results /tmp/keep/ || true
          cp -r pokemon-agent/bundles /tmp/keep/ || true
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          cp -r /tmp/keep/kaggle_results/. pokemon-agent/kaggle_results/ || true
          cp -r /tmp/keep/bundles/. pokemon-agent/bundles/ || true
          git add -f pokemon-agent/kaggle_results/submit_2am.log pokemon-agent/bundles/ || true
          git commit -m "submit log [skip ci]" || echo "no changes"
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
