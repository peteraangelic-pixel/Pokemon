name: submit-best-2am

on:
  schedule:
    - cron: "0 0 * * *"  # 00:00 UTC = 02:00 Warsaw (CEST)
  workflow_dispatch:
    inputs:
      agent:
        description: "Agent to submit (path)"
        default: "agents/main_policy_v59_10k.py"
        required: false
      name:
        description: "Bundle name"
        default: "v59_10k_1M_772val"
        required: false
      message:
        description: "Submission message"
        default: "v59 10k games 998k decisions 0.772 val_acc, 142g/s mt, matrix 5x2000g"
        required: false

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install kaggle
        run: pip install --quiet kaggle
      - name: Configure Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          if [ -n "$KAGGLE_API_TOKEN" ]; then
            printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]' > ~/.kaggle/access_token
            chmod 600 ~/.kaggle/access_token
            echo "Using KAGGLE_API_TOKEN"
          elif [ -n "$KAGGLE_USERNAME" ] && [ -n "$KAGGLE_KEY" ]; then
            printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
            chmod 600 ~/.kaggle/kaggle.json
            echo "Using KAGGLE_USERNAME/KEY"
          else
            echo "No Kaggle credentials - skipping submit (dry run)"
            exit 0
          fi
      - name: Build bundle
        run: |
          cd pokemon-agent
          AGENT="${{ inputs.agent || 'agents/main_policy_v59_10k.py' }}"
          NAME="${{ inputs.name || 'v59_10k_1M_772val' }}"
          # If best_agent.txt exists, use it
          if [ -f kaggle_results/best_agent.txt ]; then
            BEST=$(cat kaggle_results/best_agent.txt)
            if [ -n "$BEST" ] && [ -f "$BEST" ]; then
              AGENT="$BEST"
              echo "Using best_agent.txt: $AGENT"
            fi
          fi
          echo "Building bundle for $AGENT as $NAME"
          ls -lh $AGENT || echo "agent not found, trying v58"
          if [ ! -f "$AGENT" ]; then AGENT="agents/main_policy_v58_rust.py"; fi
          python build_submission.py --agent $AGENT --name $NAME
          ls -lh bundles/${NAME}.tar.gz
      - name: Submit
        env:
          BUNDLE_NAME: ${{ inputs.name || 'v59_10k_1M_772val' }}
          MESSAGE: ${{ inputs.message || 'v59 10k games 998k decisions 0.772 val_acc, 142g/s mt' }}
        run: |
          cd pokemon-agent
          BUNDLE="bundles/${BUNDLE_NAME}.tar.gz"
          if [ ! -f "$BUNDLE" ]; then
            # Find latest bundle
            BUNDLE=$(ls -t bundles/*.tar.gz | head -1)
            echo "Using latest bundle $BUNDLE"
          fi
          echo "Submitting $BUNDLE with message $MESSAGE"
          kaggle competitions submit -c the-pokemon-company-ptcg-ai-battle-challenge-playground -f $BUNDLE -m "$MESSAGE" 2>&1 | tee kaggle_results/submit_2am.log
          kaggle competitions submissions -c the-pokemon-company-ptcg-ai-battle-challenge-playground 2>&1 | head -20
      - name: Commit log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f pokemon-agent/kaggle_results/submit_2am.log pokemon-agent/bundles/ || true
          git commit -m "submit 2am log [skip ci]" || echo "no changes"
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
