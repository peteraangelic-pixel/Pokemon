name: kaggle-replays

on:
  workflow_dispatch:
    inputs:
      top_k:
        description: "Last N episodes per live submission"
        required: false
        default: "7"
      include_official:
        description: "Try official top-episodes dataset (large, slow)"
        required: false
        default: "false"
  push:
    branches: ["arena/c87f7a48-pokemon"]
    paths:
      - "pokemon-agent/kaggle_results/replays.trigger"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  replays:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet kaggle

      - name: Configure Kaggle credentials
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle pokemon-agent/kaggle_results/replays
          if [ -n "$KAGGLE_API_TOKEN" ]; then
            printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]' > ~/.kaggle/access_token; chmod 600 ~/.kaggle/access_token
          elif [ -n "$KAGGLE_USERNAME" ] && [ -n "$KAGGLE_KEY" ]; then
            python3 - "$KAGGLE_USERNAME" "$KAGGLE_KEY" <<'PY'
          import json, os
          json.dump({"username": os.environ["KAGGLE_USERNAME"], "key": os.environ["KAGGLE_KEY"]}, open(os.path.expanduser("~/.kaggle/kaggle.json"), "w"))
          PY
            chmod 600 ~/.kaggle/kaggle.json
          else
            echo "no auth" && exit 1
          fi

      - name: Fetch our replays
        run: |
          if [ "${{ inputs.include_official }}" = "true" ]; then OFFICIAL="--include-official"; else OFFICIAL="--no-official"; fi
          python pokemon-agent/tools/fetch_replays.py --competition "the-pokemon-company-ptcg-ai-battle-challenge-playground" --outdir pokemon-agent/kaggle_results/replays --top-k "${{ inputs.top_k || '7' }}" $OFFICIAL 2>&1 | tee /tmp/fetch.log
          cp /tmp/fetch.log pokemon-agent/kaggle_results/replays/fetch.log || true
          cat pokemon-agent/kaggle_results/replays/summary.md || true

      - name: Analyze replays
        run: |
          python pokemon-agent/tools/analyze_replays.py --replays-dir pokemon-agent/kaggle_results/replays 2>&1 | tee pokemon-agent/kaggle_results/replays/analysis.log
          cat pokemon-agent/kaggle_results/replays/analysis.md || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaggle-replays
          path: pokemon-agent/kaggle_results/replays/
          if-no-files-found: warn

      - name: Commit back (small files only)
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          find pokemon-agent/kaggle_results/replays -type f -size +5M -delete || true
          if [ -d pokemon-agent/kaggle_results/replays/official ]; then
            find pokemon-agent/kaggle_results/replays/official -type f -name "*.json" | tail -n +21 | xargs rm -f || true
          fi
          git add pokemon-agent/kaggle_results/replays/ || true
          if [ -n "$(git status --porcelain pokemon-agent/kaggle_results/replays)" ]; then
            git commit -m "chore(kaggle): replays + analysis top ${{ inputs.top_k || '7' }} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
