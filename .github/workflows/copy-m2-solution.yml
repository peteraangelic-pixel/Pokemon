name: Copy M2 Solution

on:
  workflow_dispatch:
  push:
    branches: ["arena/7911f950-pokemon"]
    paths:
      - "arc-agi-3/llm-agent/notebook/.copy-m2.trigger"

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install Kaggle CLI
        run: pip install kaggle
      
      - name: Configure Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p .kaggle
          printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]' > .kaggle/access_token
          chmod 600 .kaggle/access_token
      
      - name: Pull M2 Solution notebook
        run: |
          export KAGGLE_API_TOKEN=$(cat .kaggle/access_token)
          mkdir -p /tmp/m2-notebook
          cd /tmp/m2-notebook
          
          echo "=== Pulling jingshuifu/arc3-m2-solution ==="
          kaggle kernels pull jingshuifu/arc3-m2-solution 2>&1 | tee pull-log.txt
          
          echo -e "\n=== Files pulled ==="
          ls -lah 2>&1
          
          if [ -f arc3-m2-solution.ipynb ]; then
            echo -e "\n=== Notebook size ==="
            wc -l arc3-m2-solution.ipynb
            
            echo -e "\n=== First 50 lines ==="
            head -50 arc3-m2-solution.ipynb
          fi
      
      - name: Announce
        if: always()
        run: |
          body=$(cat /tmp/m2-notebook/pull-log.txt 2>/dev/null || echo "(no data)")
          body=$(echo "$body" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
          echo "::notice title=M2 Pull Result::$body"
