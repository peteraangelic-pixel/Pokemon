name: rl-train
on:
  push:
    paths: ['pokemon-agent/rl_train.trigger']
  workflow_dispatch: {}
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: arena/a450b00f-pokemon }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install deps
        run: |
          pip install --quiet kaggle-environments jax flax optax numpy
          cp -r pokemon-agent /tmp/pa && cd /tmp/pa && python -c "import jax, flax; print('deps ok')"
      - name: Train BC + PPO vs league
        working-directory: pokemon-agent
        run: |
          python -m rl.train --bc-games 6000 --bc-steps 2500 --ppo-iters 60 --ppo-games 300 --eval-games 200 --out rl/params_best.npz 2>&1 | tee rl/train_log.txt
      - name: Commit params back
        run: |
          git config user.email "actions@github.com"; git config user.name "rl-train"
          git add pokemon-agent/rl/params_best.npz pokemon-agent/rl/train_log.txt || true
          git commit -m "rl: BC+PPO training run (league) [skip ci]" || echo "nothing to commit"
          git push origin HEAD:arena/a450b00f-pokemon || true
