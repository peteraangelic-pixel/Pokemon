name: matrix-verify

# Factorial 4-arm comparison (policy x deck):
#   A = v22b + 30W (current live candidate, control)
#   B = v22b + 35W-noBoss (deck lever)
#   C = v24  + 30W (board-development policy lever, from 8560a56a)
#   D = v24  + 35W-noBoss (merged candidate)
# via tools/ab_matrix.py — in-process interleaved, rotated blocks.
# Job "thick_mirrors" uses opp_thickbot.py as the fixed developing opponent
# (measurement-trap fix: self-play rewards the shared thin-board defect).
#
# Trigger: push pokemon-agent/kaggle_results/matrix_verify.trigger

on:
  push:
    branches: ["arena/a450b00f-pokemon", "arena/c87f7a48-pokemon"]
    paths:
      - "pokemon-agent/kaggle_results/matrix_verify.trigger"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: meta1012,      pools: "decks/meta1012",                          blocks: 2, games: 30, opp: "" }
          - { name: water_meta,    pools: "decks/meta1012_water",                    blocks: 2, games: 60, opp: "" }
          - { name: top30_live,    pools: "decks/top30_live",                        blocks: 1, games: 60, opp: "" }
          - { name: broad_field,   pools: "decks/broad_field",                       blocks: 1, games: 40, opp: "" }
          - { name: thick_mirrors, pools: "decks/meta1012_water",                    blocks: 2, games: 50, opp: "agents/opp_thickbot.py" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          cd pokemon-agent
          python -m venv .venv
          .venv/bin/pip install --quiet kaggle-environments

      - name: Factorial 4-arm A/B (v22b/v22c x 30W/35W-noBoss)
        env:
          POOLS: ${{ matrix.pools }}
          BLOCKS: ${{ matrix.blocks }}
          GAMES: ${{ matrix.games }}
          OPP: ${{ matrix.opp }}
        run: |
          set -e
          cd pokemon-agent
          mkdir -p kaggle_results/matrix_verify
          OPPARG=""
          if [ -n "$OPP" ]; then OPPARG="--opp-agent $OPP"; fi
          .venv/bin/python tools/ab_matrix.py \
            --pairs "B_v22b_35=agents/main_heuristic_v22b.py:decks/v22_35w_noBoss.csv,D_v24d_35=agents/main_heuristic_v24d.py:decks/v22_35w_noBoss.csv,V25_35=agents/main_heuristic_v25_genius.py:decks/v22_35w_noBoss.csv,E_v25k_35=agents/main_heuristic_v25.py:decks/v22_35w_noBoss.csv" \
            --pools "$POOLS" --blocks "$BLOCKS" --block-games "$GAMES" $OPPARG \
            | tee "kaggle_results/matrix_verify/${{ matrix.name }}.txt"

      - name: Commit results (rebase-retry)
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && break || sleep $((i*10))
          done
          git add -f pokemon-agent/kaggle_results/matrix_verify/ || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "matrix-verify: ${{ matrix.name }} [skip ci]"
            for i in 1 2 3; do
              git push origin "HEAD:${GITHUB_REF_NAME}" && break || { sleep $((i*5)); git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true; }
            done
          fi
