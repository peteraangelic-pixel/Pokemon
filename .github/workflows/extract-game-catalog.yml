name: Extract Game Catalog

on:
  workflow_dispatch:
  push:
    branches: ["arena/7911f950-pokemon"]
    paths:
      - "arc-agi-3/.extract-catalog.trigger"

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install Kaggle CLI
        run: pip install kaggle
      
      - name: Configure Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p .kaggle
          printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]' > .kaggle/access_token
          chmod 600 .kaggle/access_token
      
      - name: Download and analyze games
        run: |
          export KAGGLE_API_TOKEN=$(cat .kaggle/access_token)
          
          # Download competition data
          mkdir -p /tmp/arc-dl
          cd /tmp/arc-dl
          kaggle competitions download -c arc-prize-2026-arc-agi-3 -p . 2>&1
          
          # Unzip
          for f in *.zip; do
            if [ -f "$f" ]; then
              unzip -q "$f" -d "${f%.zip}" 2>&1
            fi
          done
          
          # Build catalog
          CATALOG=/tmp/arc-dl/game-catalog.md
          echo "# ARC-AGI-3 Demo Games Catalog" > $CATALOG
          echo "" >> $CATALOG
          echo "Total: $(find arc-prize-2026-arc-agi-3/environment_files -name '*.py' | wc -l) games" >> $CATALOG
          echo "" >> $CATALOG
          
          for game_py in $(find arc-prize-2026-arc-agi-3/environment_files -name "*.py" | sort); do
            game_dir=$(dirname "$game_py")
            game_id=$(basename "$game_py" .py)
            parent_dir=$(basename $(dirname "$game_dir"))
            
            echo "## Game: ${parent_id}/${game_id}" >> $CATALOG
            echo "" >> $CATALOG
            
            # Metadata
            metadata_json="${game_dir}/metadata.json"
            if [ -f "$metadata_json" ]; then
              echo "### Metadata" >> $CATALOG
              echo '```json' >> $CATALOG
              cat "$metadata_json" >> $CATALOG
              echo '```' >> $CATALOG
              echo "" >> $CATALOG
            fi
            
            # Key functions
            echo "### Key functions (win/score/goal/level)" >> $CATALOG
            echo '```python' >> $CATALOG
            grep -n "def \|class \|win\|score\|goal\|complete\|finish\|level\|reset\|condition" "$game_py" | head -40 >> $CATALOG
            echo '```' >> $CATALOG
            echo "" >> $CATALOG
          done
          
          echo "=== Catalog size ==="
          wc -l $CATALOG
          
          # Upload catalog as artifact
          mkdir -p /tmp/artifacts
          cp $CATALOG /tmp/artifacts/game-catalog.md
      
      - name: Upload catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-catalog
          path: /tmp/artifacts/game-catalog.md
          retention-days: 30
      
      - name: Announce
        if: always()
        run: |
          echo "::notice title=Game Catalog::Catalog uploaded as artifact 'game-catalog' (game-catalog.md)"
