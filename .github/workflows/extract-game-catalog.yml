name: Extract Game Catalog

on:
  workflow_dispatch:
  push:
    branches: ["arena/7911f950-pokemon"]
    paths:
      - "arc-agi-3/.extract-catalog.trigger"

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install Kaggle CLI
        run: pip install kaggle
      
      - name: Configure Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p .kaggle
          printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]' > .kaggle/access_token
          chmod 600 .kaggle/access_token
      
      - name: Download and analyze games
        run: |
          export KAGGLE_API_TOKEN=$(cat .kaggle/access_token)
          
          # Download competition data
          mkdir -p /tmp/arc-dl
          cd /tmp/arc-dl
          kaggle competitions download -c arc-prize-2026-arc-agi-3 -p . 2>&1
          
          # Unzip
          for f in *.zip; do
            if [ -f "$f" ]; then
              unzip -q "$f" -d "${f%.zip}" 2>&1
            fi
          done
          
          # Extract metadata for all games
          echo "=== Game Metadata ==="
          for game_py in $(find arc-prize-2026-arc-agi-3/environment_files -name "*.py" | sort); do
            game_dir=$(dirname "$game_py")
            game_id=$(basename "$game_py" .py)
            parent_dir=$(basename $(dirname "$game_dir"))
            
            metadata_json="${game_dir}/metadata.json"
            
            echo -e "\n### Game: ${parent_dir}/${game_id} ###"
            
            if [ -f "$metadata_json" ]; then
              echo "Metadata:"
              cat "$metadata_json"
            fi
          done
          
          echo -e "\n\n=== Total games: $(find arc-prize-2026-arc-agi-3/environment_files -name '*.py' | wc -l) ==="
      
      - name: Announce part 1
        run: |
          echo "::notice title=Game Metadata::See workflow logs for full catalog"
