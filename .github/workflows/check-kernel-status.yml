name: Check Kernel Status

on:
  workflow_dispatch:
  push:
    branches: ["arena/7911f950-pokemon"]
    paths:
      - "arc-agi-3/llm-agent/notebook/.check-kernel.trigger"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install Kaggle CLI
        run: pip install kaggle
      
      - name: Configure Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p .kaggle
          printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]' > .kaggle/access_token
          chmod 600 .kaggle/access_token
      
      - name: Check kernel status
        run: |
          export KAGGLE_API_TOKEN=$(cat .kaggle/access_token)
          
          echo "=== Kernel status ==="
          kaggle kernels status "petersharps/arc-agi-3-llm-agent-qwen2-5-7b-nf4-for-t4" 2>&1 | tee kernel-status.txt
          
          echo -e "\n=== Kernel output ==="
          kaggle kernels output "petersharps/arc-agi-3-llm-agent-qwen2-5-7b-nf4-for-t4" -p /tmp/kernel-output 2>&1 | tee kernel-output.txt
          
          if [ -f /tmp/kernel-output/submission.parquet ]; then
            echo -e "\n=== submission.parquet exists ==="
            ls -lh /tmp/kernel-output/submission.parquet
          fi
          
          if [ -f /tmp/kernel-output/log.txt ]; then
            echo -e "\n=== Last 50 lines of log.txt ==="
            tail -50 /tmp/kernel-output/log.txt
          fi
      
      - name: Announce
        if: always()
        run: |
          {
            echo "=== Kernel Status ==="
            cat kernel-status.txt 2>/dev/null || echo "(no data)"
            echo -e "\n=== Kernel Output ==="
            cat kernel-output.txt 2>/dev/null || echo "(no data)"
          } > /tmp/kernel-report.txt
          
          python3 - <<'PY'
          body = open('/tmp/kernel-report.txt').read()
          body = body.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(f"::notice title=Kernel Status::{body[:4500]}")
          PY
