name: analyze-losses-3h (fetch + test resistant, NO auto-submit)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/c87f7a48-pokemon
    paths:
      - pokemon-agent/kaggle_results/analyze_3h.trigger
  schedule:
    - cron: "30 4 * * *"  # 04:30 UTC = 06:30 Warsaw - exactly 3h from user request 01:32 UTC
    - cron: "0 */3 * * *"  # also every 3h as backup

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install --quiet kaggle numpy
      - name: Configure Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          if [ -n "${KAGGLE_API_TOKEN:-}" ]; then
            printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]' > ~/.kaggle/access_token; chmod 600 ~/.kaggle/access_token
          elif [ -n "${KAGGLE_USERNAME:-}" ] && [ -n "${KAGGLE_KEY:-}" ]; then
            printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json; chmod 600 ~/.kaggle/kaggle.json
          else
            echo "no creds"; exit 1
          fi
      - name: Fetch our replays (both active submissions)
        run: |
          set -e
          mkdir -p pokemon-agent/kaggle_results/our_replays
          python pokemon-agent/tools/fetch_replays.py --competition the-pokemon-company-ptcg-ai-battle-challenge-playground --outdir pokemon-agent/kaggle_results/our_replays --top-k 80 --no-official > /tmp/fetch.log 2>&1 || true
          cat /tmp/fetch.log | tail -n 150
          cp /tmp/fetch.log pokemon-agent/kaggle_results/our_replays/fetch_log.txt || true
          echo "=== Latest submissions ==="
          cat pokemon-agent/kaggle_results/latest_submissions.txt | head -n 10 || true
      - name: Summarize + detailed loss analysis
        run: |
          python pokemon-agent/tools/summarize_episodes.py --outdir pokemon-agent/kaggle_results/our_replays > /tmp/sum.log 2>&1 || true
          cat /tmp/sum.log
          python pokemon-agent/tools/analyze_losses_detailed.py > /tmp/detailed.log 2>&1 || true
          cat /tmp/detailed.log
          cat pokemon-agent/kaggle_results/our_replays/detailed_analysis.md | head -n 250
      - name: Build resistant versions v74 v75 if missing
        run: |
          if [ ! -f pokemon-agent/agents/v74_alakazam_resistant.py ]; then
            python3 - << 'PY'
          import pathlib
          src=pathlib.Path("pokemon-agent/agents/v70_alakazam_endgame.py").read_text()
          src=src.replace("board_n<=2 and (our_prizes<=3", "board_n<=3 and (our_prizes<=4")
          src=src.replace("board_n<=2:", "board_n<=3:")
          src=src.replace("if board_n<=2 and our_prizes<=3:", "if board_n<=3 and our_prizes<=4:")
          src=src.replace('"""v70:', '"""v74: ultra resistant 3h analysis 71 losses 59% wipe board<=3 prize<=4\n\n')
          pathlib.Path("pokemon-agent/agents/v74_alakazam_resistant.py").write_text(src)
          print("built v74")
          PY
          fi
          ls -lh pokemon-agent/agents/v7*.py
      - name: Build new_losses decks from recent loss replays
        run: |
          cd pokemon-agent
          python3 - << 'PY'
          import json, glob, os, pathlib
          from collections import Counter
          outdir="decks/new_losses"
          os.makedirs(outdir, exist_ok=True)
          # extract full decks from loss replays (serial_map gives full 60)
          for ep_path in glob.glob("kaggle_results/our_replays/loss_replays/episode-*.json"):
              try:
                  d=json.load(open(ep_path))
                  teams=(d.get("info") or {}).get("TeamNames") or []
                  if "PeterSharps" not in teams:
                      continue
                  our_idx=teams.index("PeterSharps")
                  opp_idx=1-our_idx
                  opp_name=teams[opp_idx].replace(" ","_").replace("/","_")[:40]
                  ep_id=pathlib.Path(ep_path).stem.replace("episode-","").replace("-replay","")
                  serial_map={}
                  for s in d.get("steps") or []:
                      for ag in s:
                          o=ag.get("observation") or {}
                          for e in o.get("logs") or []:
                              pi=e.get("playerIndex"); ser=e.get("serial"); cid=e.get("cardId")
                              if pi is not None and ser is not None and cid is not None:
                                  serial_map[(pi,int(ser))]=int(cid)
                  opp=[v for (pi,_),v in serial_map.items() if pi==opp_idx]
                  if len(opp)<20:
                      continue
                  if len(opp)<60:
                      cnt=Counter(opp)
                      energies=[c for c in opp if c<=8]
                      most=Counter(energies).most_common(1)[0][0] if energies else 1
                      opp=opp+[most]*(60-len(opp))
                  opp=opp[:60]
                  out=f"{outdir}/{ep_id}_{opp_name}.csv"
                  open(out,"w").write(",".join(map(str,opp)))
                  print(f"{ep_id} {opp_name} {len(opp)}")
              except Exception as ex:
                  print(f"skip {ep_path} {ex}")
          print("new_losses count", len(list(pathlib.Path(outdir).glob("*.csv"))))
          PY
      - name: Thorough test v70 vs v74 vs v75 vs v76 vs v77 vs v78 on top30, pool_v3, new_losses
        run: |
          pip install --quiet kaggle-environments
          cd pokemon-agent
          echo "=== v70 pool_v3 20g ===" | tee /tmp/compare.txt
          python tools/gauntlet_ffi.py --agent agents/v70_alakazam_endgame.py --our-deck decks/v66_alakazam_simple.csv --opp-dir decks/pool_v3 --games 20 --workers 2 --paired 2>&1 | tee -a /tmp/compare.txt | tail -n 25
          echo "" | tee -a /tmp/compare.txt
          echo "=== v74 pool_v3 20g ===" | tee -a /tmp/compare.txt
          python tools/gauntlet_ffi.py --agent agents/v74_alakazam_resistant.py --our-deck decks/v66_alakazam_simple.csv --opp-dir decks/pool_v3 --games 20 --workers 2 --paired 2>&1 | tee -a /tmp/compare.txt | tail -n 25
          echo "" | tee -a /tmp/compare.txt
          echo "=== v75 pool_v3 20g ===" | tee -a /tmp/compare.txt
          python tools/gauntlet_ffi.py --agent agents/v75_alakazam_resistant_final.py --our-deck decks/v66_alakazam_simple.csv --opp-dir decks/pool_v3 --games 20 --workers 2 --paired 2>&1 | tee -a /tmp/compare.txt | tail -n 25
          echo "" | tee -a /tmp/compare.txt
          echo "=== v76 pool_v3 20g ===" | tee -a /tmp/compare.txt
          python tools/gauntlet_ffi.py --agent agents/v76_alakazam_ultra_resistant.py --our-deck decks/v76_alakazam_ultra_resistant.csv --opp-dir decks/pool_v3 --games 20 --workers 2 --paired 2>&1 | tee -a /tmp/compare.txt | tail -n 25
          echo "" | tee -a /tmp/compare.txt
          echo "=== v77 pool_v3 20g ===" | tee -a /tmp/compare.txt
          python tools/gauntlet_ffi.py --agent agents/v77_alakazam_balanced.py --our-deck decks/v77_alakazam_balanced.csv --opp-dir decks/pool_v3 --games 20 --workers 2 --paired 2>&1 | tee -a /tmp/compare.txt | tail -n 25
          echo "" | tee -a /tmp/compare.txt
          echo "=== v78 pool_v3 20g ===" | tee -a /tmp/compare.txt
          python tools/gauntlet_ffi.py --agent agents/v78_alakazam_tank.py --our-deck decks/v78_alakazam_tank.csv --opp-dir decks/pool_v3 --games 20 --workers 2 --paired 2>&1 | tee -a /tmp/compare.txt | tail -n 25
          echo "" | tee -a /tmp/compare.txt
          echo "=== v70 top30 20g ===" | tee -a /tmp/compare.txt
          python tools/gauntlet_ffi.py --agent agents/v70_alakazam_endgame.py --our-deck decks/v66_alakazam_simple.csv --opp-dir decks/top30_live --games 20 --workers 2 --paired 2>&1 | tee -a /tmp/compare.txt | tail -n 25
          echo "" | tee -a /tmp/compare.txt
          echo "=== v74 top30 20g ===" | tee -a /tmp/compare.txt
          python tools/gauntlet_ffi.py --agent agents/v74_alakazam_resistant.py --our-deck decks/v66_alakazam_simple.csv --opp-dir decks/top30_live --games 20 --workers 2 --paired 2>&1 | tee -a /tmp/compare.txt | tail -n 25
          echo "" | tee -a /tmp/compare.txt
          echo "=== v75 top30 10g (quick) ===" | tee -a /tmp/compare.txt
          python tools/gauntlet_ffi.py --agent agents/v75_alakazam_resistant_final.py --our-deck decks/v66_alakazam_simple.csv --opp-dir decks/top30_live --games 10 --workers 2 --paired 2>&1 | tee -a /tmp/compare.txt | tail -n 25
          echo "" | tee -a /tmp/compare.txt
          echo "=== v76 top30 20g ===" | tee -a /tmp/compare.txt
          python tools/gauntlet_ffi.py --agent agents/v76_alakazam_ultra_resistant.py --our-deck decks/v76_alakazam_ultra_resistant.csv --opp-dir decks/top30_live --games 20 --workers 2 --paired 2>&1 | tee -a /tmp/compare.txt | tail -n 25
          echo "" | tee -a /tmp/compare.txt
          echo "=== v77 top30 20g ===" | tee -a /tmp/compare.txt
          python tools/gauntlet_ffi.py --agent agents/v77_alakazam_balanced.py --our-deck decks/v77_alakazam_balanced.csv --opp-dir decks/top30_live --games 20 --workers 2 --paired 2>&1 | tee -a /tmp/compare.txt | tail -n 25
          echo "" | tee -a /tmp/compare.txt
          echo "=== v78 top30 20g ===" | tee -a /tmp/compare.txt
          python tools/gauntlet_ffi.py --agent agents/v78_alakazam_tank.py --our-deck decks/v78_alakazam_tank.csv --opp-dir decks/top30_live --games 20 --workers 2 --paired 2>&1 | tee -a /tmp/compare.txt | tail -n 25
          echo "" | tee -a /tmp/compare.txt
          echo "=== v70 new_losses 20g (recent wipe losses) ===" | tee -a /tmp/compare.txt
          python tools/gauntlet_ffi.py --agent agents/v70_alakazam_endgame.py --our-deck decks/v66_alakazam_simple.csv --opp-dir decks/new_losses --games 20 --workers 2 --paired 2>&1 | tee -a /tmp/compare.txt | tail -n 30
          echo "" | tee -a /tmp/compare.txt
          echo "=== v74 new_losses 20g ===" | tee -a /tmp/compare.txt
          python tools/gauntlet_ffi.py --agent agents/v74_alakazam_resistant.py --our-deck decks/v66_alakazam_simple.csv --opp-dir decks/new_losses --games 20 --workers 2 --paired 2>&1 | tee -a /tmp/compare.txt | tail -n 30
          echo "" | tee -a /tmp/compare.txt
          echo "=== v75 new_losses 20g ===" | tee -a /tmp/compare.txt
          python tools/gauntlet_ffi.py --agent agents/v75_alakazam_resistant_final.py --our-deck decks/v66_alakazam_simple.csv --opp-dir decks/new_losses --games 20 --workers 2 --paired 2>&1 | tee -a /tmp/compare.txt | tail -n 30
          echo "" | tee -a /tmp/compare.txt
          echo "=== v76 new_losses 20g ===" | tee -a /tmp/compare.txt
          python tools/gauntlet_ffi.py --agent agents/v76_alakazam_ultra_resistant.py --our-deck decks/v76_alakazam_ultra_resistant.csv --opp-dir decks/new_losses --games 20 --workers 2 --paired 2>&1 | tee -a /tmp/compare.txt | tail -n 30
          echo "" | tee -a /tmp/compare.txt
          echo "=== v77 new_losses 20g ===" | tee -a /tmp/compare.txt
          python tools/gauntlet_ffi.py --agent agents/v77_alakazam_balanced.py --our-deck decks/v77_alakazam_balanced.csv --opp-dir decks/new_losses --games 20 --workers 2 --paired 2>&1 | tee -a /tmp/compare.txt | tail -n 30
          echo "" | tee -a /tmp/compare.txt
          echo "=== v78 new_losses 20g ===" | tee -a /tmp/compare.txt
          python tools/gauntlet_ffi.py --agent agents/v78_alakazam_tank.py --our-deck decks/v78_alakazam_tank.csv --opp-dir decks/new_losses --games 20 --workers 2 --paired 2>&1 | tee -a /tmp/compare.txt | tail -n 30
          cat /tmp/compare.txt
          cp /tmp/compare.txt kaggle_results/our_replays/compare_v70_v74_v75.txt
          cp /tmp/compare.txt kaggle_results/our_replays/compare_v70_v74_v75_v76.txt
          cp /tmp/compare.txt kaggle_results/our_replays/compare_v70_v77.txt
          cp /tmp/compare.txt kaggle_results/our_replays/compare_v78.txt
      - name: Write recommendation (NO auto-submit)
        run: |
          cat > pokemon-agent/kaggle_results/our_replays/next_submission_recommendation.md << 'MD'
          # Next submission recommendation - DO NOT AUTO-SUBMIT per user 2026-10-17

          User: "dopiero jak przetestujesz na nowych przegranych meczach za 3h i okaze sie ze twoja nowa wersja super radzi sobie z tymi przegranymi.. szkoda slotu"

          This workflow tests v70 (current best, 0.637 top30 20g, 0.55 pool, 600 rating) vs v74 (board<=3 prize<=4, 0.693 top30 10g / 0.63 20g, 0.6 vs Mengfei wall) vs v75 (final resistant).

          It does NOT submit automatically. User must manually trigger submit_best_2am.yml with distinct bundle name after reviewing compare.txt and detailed_analysis.md.

          ## Current active submissions (as of fetch)
          - 57290311 v63_super_fix_a450 (second branch, Kyogre) 773.7 - 2W-0L public
          - 57290256 v70g_alakazam 600.0 - only validation, 0 public games yet

          ## How to decide next submit after 3h:
          1. Wait for v70g to have 10+ public games (check episodes_57290256.csv)
          2. Check loss_reasons.json for new wipe losses - if still 50%+ wipe, v74 should be better (it has +100 guard vs +500 in v63 Kyogre)
          3. Compare compare_v70_v74_v75.txt - if v74 or v75 beats v70 by >0.03 on top30 20g AND beats Mengfei wall, then recommend v74/v75 with distinct name
          4. Otherwise keep v70 or switch to Kyogre v63 (which has 773.7) - second branch is currently better because Kyogre meta > Alakazam

          ## Slots
          Only last 2 submissions active. Currently active: v63 (773.7) and v70g (600.0). 4 submissions remaining today per last log. Do not waste slot without thorough test.
          MD
          cat pokemon-agent/kaggle_results/our_replays/next_submission_recommendation.md
      - name: Commit analysis + tests (no auto-submit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f pokemon-agent/kaggle_results/our_replays/ pokemon-agent/agents/v74_alakazam_resistant.py pokemon-agent/agents/v75_alakazam_resistant_final.py pokemon-agent/agents/v76_alakazam_ultra_resistant.py pokemon-agent/agents/v77_alakazam_balanced.py pokemon-agent/agents/v78_alakazam_tank.py pokemon-agent/decks/v76_alakazam_ultra_resistant.csv pokemon-agent/decks/v77_alakazam_balanced.csv pokemon-agent/decks/v78_alakazam_tank.csv || true
          git commit -m "chore(analyze): 3h both active losses + thorough test v70 vs v74 vs v75 vs v76 vs v77 vs v78 tank, NO auto-submit per user [skip ci]" || echo "no changes"
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loss-analysis-3h-both
          path: |
            pokemon-agent/kaggle_results/our_replays/
            /tmp/compare.txt
            /tmp/fetch.log
            /tmp/sum.log
          if-no-files-found: warn
