name: gauntlet-heavy-100g

on:
  workflow_dispatch:
    inputs:
      agent:
        description: "Agent path"
        default: "pokemon-agent/agents/main_heuristic_v18.py"
        required: false
      deck:
        description: "Deck path"
        default: "pokemon-agent/decks/v12_30_boss4.csv"
        required: false
      games:
        description: "Games per matchup"
        default: "100"
        required: false
      opp_dir:
        description: "Opponent dir: broad_field, top30_live, v14_opp_test, gen8_meta"
        default: "broad_field"
        required: false
  push:
    branches: ["arena/c87f7a48-pokemon"]
    paths:
      - "pokemon-agent/kaggle_results/gauntlet_heavy.trigger"

permissions:
  contents: write

jobs:
  heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install deps
        run: |
          cd pokemon-agent
          python -m venv .venv
          .venv/bin/pip install --quiet kaggle-environments

      - name: Build Rust binaries
        run: |
          cd pokemon-agent/rust
          cargo build --release --bin rust_gauntlet --bin evolve_tempo --bin gauntlet_rust 2>&1 | tail -20
          ls -lh target/release/rust_gauntlet target/release/evolve_tempo target/release/gauntlet_rust 2>&1 | tail -10

      - name: Run heavy gauntlet 100g
        env:
          AGENT: ${{ inputs.agent || 'pokemon-agent/agents/main_heuristic_v18.py' }}
          DECK: ${{ inputs.deck || 'pokemon-agent/decks/v12_30_boss4.csv' }}
          GAMES: ${{ inputs.games || '100' }}
          OPP_DIR: ${{ inputs.opp_dir || 'broad_field' }}
        run: |
          cd pokemon-agent
          echo "Heavy test: $AGENT + $DECK vs $OPP_DIR $GAMES games"
          echo "=== FFI gauntlet ==="
          .venv/bin/python tools/gauntlet_ffi.py --agent $AGENT --our-deck $DECK --opp-dir decks/$OPP_DIR --games $GAMES --workers 8 2>&1 | tee /tmp/heavy.log
          cat /tmp/heavy.log | tail -100
          echo "=== Tempo ==="
          .venv/bin/python tools/gauntlet_tempo.py --agent $AGENT --our-deck $DECK --opp-dir decks/gen8_meta --games 20 2>&1 | tee /tmp/tempo.log
          cat /tmp/tempo.log | tail -20
          # Save results
          mkdir -p kaggle_results/heavy
          cp /tmp/heavy.log kaggle_results/heavy/${{ inputs.opp_dir || 'broad_field' }}_${{ inputs.games || '100' }}g_$(basename ${{ inputs.agent || 'v18' }}).log
          cp /tmp/tempo.log kaggle_results/heavy/tempo_$(basename ${{ inputs.agent || 'v18' }}).log

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git add -f pokemon-agent/kaggle_results/heavy/ || true
          git diff --cached --stat
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "heavy gauntlet 100g: ${{ inputs.opp_dir || 'broad_field' }} ${{ inputs.games || '100' }}g $(basename ${{ inputs.agent || 'v18' }}) [skip ci]"; git push origin "HEAD:${GITHUB_REF_NAME}"; fi
