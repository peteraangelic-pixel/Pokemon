name: Check Submission 57125322

on:
  workflow_dispatch:
  push:
    branches: ["arena/7911f950-pokemon"]
    paths:
      - "arc-agi-3/.check-57125322.trigger"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install Kaggle CLI
        run: pip install kaggle
      
      - name: Configure Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p .kaggle
          printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]' > .kaggle/access_token
          chmod 600 .kaggle/access_token
      
      - name: Check submission status
        run: |
          export KAGGLE_API_TOKEN=$(cat .kaggle/access_token)
          
          echo "=== All submissions ==="
          kaggle competitions submissions -c arc-prize-2026-arc-agi-3 --csv 2>&1 | tee submissions.txt
          
          echo -e "\n=== Submission limits ==="
          kaggle competitions submission-limits -c arc-prize-2026-arc-agi-3 2>&1 | tee limits.txt
      
      - name: Announce
        if: always()
        run: |
          {
            echo "=== Submissions ==="
            cat submissions.txt 2>/dev/null
            echo -e "\n=== Limits ==="
            cat limits.txt 2>/dev/null
          } > /tmp/sub-report.txt
          
          python3 - <<'PY'
          body = open('/tmp/sub-report.txt').read()
          body = body.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(f"::notice title=Submission Status::{body[:4500]}")
          PY
