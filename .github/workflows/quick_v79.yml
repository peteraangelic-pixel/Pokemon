name: quick-v79-kyogre
on:
  workflow_dispatch:
  push:
    branches:
      - arena/c87f7a48-pokemon
    paths:
      - pokemon-agent/kaggle_results/quick_v79.trigger
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q kaggle-environments
      - run: |
          cd pokemon-agent
          echo "=== v85 vs new_losses 40g FFI ===" | tee /tmp/q.txt
          python tools/gauntlet_ffi.py --agent agents/v85_no_imit_mirror.py --our-deck decks/c87_v44.csv --opp-dir decks/new_losses --games 40 --workers 2 --paired 2>&1 | tee -a /tmp/q.txt | tail -n 30
          echo "" | tee -a /tmp/q.txt
          echo "=== base vs new_losses 40g FFI ===" | tee -a /tmp/q.txt
          python tools/gauntlet_ffi.py --agent agents/c87_v44.py --our-deck decks/c87_v44.csv --opp-dir decks/new_losses --games 40 --workers 2 --paired 2>&1 | tee -a /tmp/q.txt | tail -n 30
          echo "" | tee -a /tmp/q.txt
          echo "=== v85 vs top30 40g FFI ===" | tee -a /tmp/q.txt
          python tools/gauntlet_ffi.py --agent agents/v85_no_imit_mirror.py --our-deck decks/c87_v44.csv --opp-dir decks/top30_live --games 40 --workers 2 --paired 2>&1 | tee -a /tmp/q.txt | tail -n 30
          echo "" | tee -a /tmp/q.txt
          echo "=== base vs top30 40g FFI ===" | tee -a /tmp/q.txt
          python tools/gauntlet_ffi.py --agent agents/c87_v44.py --our-deck decks/c87_v44.csv --opp-dir decks/top30_live --games 40 --workers 2 --paired 2>&1 | tee -a /tmp/q.txt | tail -n 30
          cat /tmp/q.txt
          cp /tmp/q.txt kaggle_results/our_replays/quick_v79_v82.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f pokemon-agent/kaggle_results/our_replays/quick_v79_v82.txt || true
          git commit -m "v85 40g new_losses + top30 FFI [skip ci]" || echo "no changes"
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
