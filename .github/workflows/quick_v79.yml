name: quick-v79-kyogre
on:
  workflow_dispatch:
  push:
    branches:
      - arena/c87f7a48-pokemon
    paths:
      - pokemon-agent/kaggle_results/quick_v79.trigger
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q kaggle-environments
      - run: |
          cd pokemon-agent
          echo "=== v84 champion tempo 2 ideas vs new_losses 20g (ffi) ===" | tee /tmp/q.txt
          python tools/gauntlet_ffi.py --agent agents/v84_champion_tempo_fix.py --our-deck decks/c87_v44.csv --opp-dir decks/new_losses --games 20 --workers 2 --paired 2>&1 | tee -a /tmp/q.txt | tail -n 30
          echo "" | tee -a /tmp/q.txt
          echo "=== v84 vs top30 20g ===" | tee -a /tmp/q.txt
          python tools/gauntlet_ffi.py --agent agents/v84_champion_tempo_fix.py --our-deck decks/c87_v44.csv --opp-dir decks/top30_live --games 20 --workers 2 --paired 2>&1 | tee -a /tmp/q.txt | tail -n 30
          echo "" | tee -a /tmp/q.txt
          echo "=== v84 mirror prizetest 400g PYTHON (real engine) ===" | tee -a /tmp/q.txt
          python tools/prizetest.py --agent agents/v84_champion_tempo_fix.py --deck decks/c87_v44.csv --games 400 2>&1 | tee -a /tmp/q.txt | tail -n 40
          echo "" | tee -a /tmp/q.txt
          echo "=== v83 Kyogre tempo fixed deck mirror prizetest 400g PYTHON ===" | tee -a /tmp/q.txt
          python tools/prizetest.py --agent agents/v83_kyogre_mirror_tempo.py --deck decks/c87_v44.csv --games 400 2>&1 | tee -a /tmp/q.txt | tail -n 40
          echo "" | tee -a /tmp/q.txt
          echo "=== c87_v44 baseline mirror prizetest 400g PYTHON ===" | tee -a /tmp/q.txt
          python tools/prizetest.py --agent agents/c87_v44.py --deck decks/c87_v44.csv --games 400 2>&1 | tee -a /tmp/q.txt | tail -n 40
          echo "" | tee -a /tmp/q.txt
          echo "=== v74 Alakazam resistant vs new_losses 20g ===" | tee -a /tmp/q.txt
          python tools/gauntlet_ffi.py --agent agents/v74_alakazam_resistant.py --our-deck decks/v66_alakazam_simple.csv --opp-dir decks/new_losses --games 20 --workers 2 --paired 2>&1 | tee -a /tmp/q.txt | tail -n 20
          cat /tmp/q.txt
          cp /tmp/q.txt kaggle_results/our_replays/quick_v79_v82.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f pokemon-agent/kaggle_results/our_replays/quick_v79_v82.txt || true
          git commit -m "quick v84 champion tempo 2 ideas + verify v83 per second branch [skip ci]" || echo "no changes"
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
