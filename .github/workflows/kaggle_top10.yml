name: kaggle-top10

# Fetch TOP10 leaders' 7 last replays — PTCG version of Kaggriculture's download_top49_replays.py
# This gets FRESH data (not 3-day-old official dataset), via team_id -> submissions -> episodes -> replays
#
# HOW IT WORKS (verified from Kaggle API code):
# 1. Download leaderboard, get top N TeamIds
# 2. For each TeamId: kaggle competitions team-submissions <team_id> -> submission IDs
# 3. For each submission: kaggle competitions episodes <sub_id> -> episode IDs
# 4. For each episode: kaggle competitions replay <ep_id> -> JSON
#
# This is what the user's run_download.cmd did for Kaggriculture (top-n 12, replays-per-team 9)
# Adapted for PTCG with same args: --top-n 10 --replays-per-team 7 --delay 0.2
#
# The Rust speedup: in Kaggriculture they had Rust port 100x faster. For PTCG we don't have Rust
# port yet (engine is libcg.so binary), but we can still simulate with Python (0.15s/game).

on:
  workflow_dispatch:
    inputs:
      top_n:
        description: "Top N teams"
        required: false
        default: "10"
      replays_per_team:
        description: "Last M replays per team"
        required: false
        default: "7"
  push:
    branches: ["arena/c87f7a48-pokemon"]
    paths:
      - "pokemon-agent/kaggle_results/top10.trigger"
      - "pokemon-agent/kaggle_results/top10_live.trigger"

permissions:
  contents: write

jobs:
  top10:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet kaggle

      - name: Configure Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p ~/.kaggle
          printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]' > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token

      - name: Download TOP10 live replays (fresh, not 3-day-old dataset)
        run: |
          set -e
          python pokemon-agent/tools/download_top10_replays.py \
            --competition "the-pokemon-company-ptcg-ai-battle-challenge-playground" \
            --top-n "${{ inputs.top_n || '10' }}" \
            --replays-per-team "${{ inputs.replays_per_team || '7' }}" \
            --outdir pokemon-agent/kaggle_results/top10_live \
            --delay 0.2 2>&1 | tee pokemon-agent/kaggle_results/top10_live/fetch.log
          echo "=== summary ==="
          cat pokemon-agent/kaggle_results/top10_live/summary.json || true
          ls -lh pokemon-agent/kaggle_results/top10_live/ | head -20

      - name: Also try official daily dataset (as backup, old data)
        continue-on-error: true
        run: |
          mkdir -p pokemon-agent/kaggle_results/top10
          for ds in \
            "kaggle/the-pokemon-company-ptcg-ai-battle-challenge-playground-episodes-2026-10-09" \
            "kaggle/the-pokemon-company-ptcg-ai-battle-challenge-playground-episodes-2026-10-08" \
            "kaggle/the-pokemon-company-ptcg-ai-battle-challenge-playground-episodes-2026-10-07" \
            "kaggle/the-pokemon-company-ptcg-ai-battle-challenge-playground-episodes-2026-10-06"; do
            echo "Trying $ds..."
            if kaggle datasets download -d "$ds" -p pokemon-agent/kaggle_results/top10 --unzip -q; then
              echo "SUCCESS $ds" | tee pokemon-agent/kaggle_results/top10/dataset.txt
              break
            fi
          done
          ls -lh pokemon-agent/kaggle_results/top10/ | head -20

      - name: Analyze both sources
        run: |
          echo "=== Analyzing live top10 ==="
          python pokemon-agent/tools/analyze_replays.py --replays-dir pokemon-agent/kaggle_results/top10_live --out pokemon-agent/kaggle_results/top10_live/analysis.md || true
          cat pokemon-agent/kaggle_results/top10_live/analysis.md | head -100 || true
          echo ""
          echo "=== Analyzing official dataset ==="
          python3 <<'PY'
          import json, csv, pathlib, collections
          from pathlib import Path
          for root_name in ["pokemon-agent/kaggle_results/top10", "pokemon-agent/kaggle_results/top10_live"]:
              root=Path(root_name)
              if not root.exists():
                  continue
              replays=list(root.glob("episode-*.json"))
              replays=[p for p in replays if p.stat().st_size>1000]
              print(f"\n{root}: {len(replays)} replays")
              team_counts=collections.Counter()
              for rp in replays[:100]:
                  try:
                      data=json.loads(rp.read_text())
                      for t in data.get("info",{}).get("TeamNames",[]):
                          team_counts[t]+=1
                  except:
                      pass
              for team,cnt in team_counts.most_common(15):
                  print(f"  {team}: {cnt}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaggle-top10-live
          path: |
            pokemon-agent/kaggle_results/top10_live/
            pokemon-agent/kaggle_results/top10/
          if-no-files-found: warn

      - name: Commit back (small files only)
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          find pokemon-agent/kaggle_results/top10 -type f -size +5M -delete || true
          find pokemon-agent/kaggle_results/top10_live -type f -size +5M -delete || true
          # Keep at most 30 jsons each
          ls -1 pokemon-agent/kaggle_results/top10/*.json 2>/dev/null | tail -n +31 | xargs rm -f || true
          ls -1 pokemon-agent/kaggle_results/top10_live/*.json 2>/dev/null | tail -n +31 | xargs rm -f || true
          git add pokemon-agent/kaggle_results/top10/ pokemon-agent/kaggle_results/top10_live/ || true
          git status --short | head -20
          if [ -n "$(git status --porcelain pokemon-agent/kaggle_results/top10* )" ]; then
            git commit -m "chore(kaggle): top10 live + official analysis [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
