name: transformer-train
on:
  push:
    paths: ['pokemon-agent/transformer_train.trigger']
  workflow_dispatch: {}

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install --quiet kaggle-environments jax[cpu] flax optax numpy tqdm
          python -c "import jax; print(jax.devices())"
      - name: Gen BC data
        working-directory: pokemon-agent
        run: |
          python tools/gen_bc_data.py --games 2400 --out /tmp/bc_data.npz --workers 4 2>&1 | tee /tmp/bc_gen.log
          ls -lh /tmp/bc_data.npz
      - name: Train transformer BC
        working-directory: pokemon-agent
        run: |
          python tools/train_transformer.py --data /tmp/bc_data.npz --out /tmp/transformer_bc.npz --epochs 10 --bs 64 --lr 1e-4 2>&1 | tee /tmp/transformer_train.log
          ls -lh /tmp/transformer_bc.npz
      - name: Commit weights
        run: |
          mkdir -p pokemon-agent/rl
          cp /tmp/bc_data.npz pokemon-agent/rl/bc_data_2400.npz || true
          cp /tmp/transformer_bc.npz pokemon-agent/rl/transformer_bc.npz || true
          cp /tmp/bc_gen.log pokemon-agent/rl/bc_gen.log || true
          cp /tmp/transformer_train.log pokemon-agent/rl/transformer_train.log || true
          git config user.email "actions@github.com"
          git config user.name "transformer-train"
          git add pokemon-agent/rl/transformer_bc.npz pokemon-agent/rl/bc_data_2400.npz pokemon-agent/rl/*.log || true
          git commit -m "transformer: BC 2400 + 10 epochs D256 L4 H4 GRU256 pointer ~3M [skip ci]" || echo "nothing"
          git push origin HEAD:${{ github.ref_name }} || true
