name: kaggle-our-replays

on:
  push:
    branches: ["arena/8560a56a-pokemon"]
    paths:
      - "pokemon-agent/kaggle_results/our_replays.trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replays:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet kaggle

      - name: Configure Kaggle credentials
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          if [ -n "$KAGGLE_API_TOKEN" ]; then
            printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]' > ~/.kaggle/access_token; chmod 600 ~/.kaggle/access_token
          elif [ -n "$KAGGLE_USERNAME" ] && [ -n "$KAGGLE_KEY" ]; then
            python3 - "$KAGGLE_USERNAME" "$KAGGLE_KEY" <<'PY'
          import json, os
          json.dump({"username": os.environ["KAGGLE_USERNAME"], "key": os.environ["KAGGLE_KEY"]}, open(os.path.expanduser("~/.kaggle/kaggle.json"), "w"))
          PY
            chmod 600 ~/.kaggle/kaggle.json
          else
            echo "no auth" && exit 1
          fi

      - name: Fetch our latest-submission replays (logs ALWAYS committed)
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: 1
        run: |
          set -u
          cd "$(dirname "$GITHUB_WORKSPACE")" 2>/dev/null || true
          cd "$GITHUB_WORKSPACE"
          OUT=pokemon-agent/kaggle_results/our_replays
          mkdir -p "$OUT"
          rm -rf "$OUT/loss_replays"

          { echo "== diag $(date -u)"; pip show kaggle 2>/dev/null | head -2
            python -m kaggle --version 2>&1 | head -1
            echo "== replay --help:"; python -m kaggle competitions replay --help 2>&1 | head -25
            echo "== episodes --help:"; python -m kaggle competitions episodes --help 2>&1 | head -15
          } > "$OUT/diag.txt" 2>&1

          python pokemon-agent/tools/fetch_replays.py \
            --competition "the-pokemon-company-ptcg-ai-battle-challenge-playground" \
            --outdir "$OUT" --top-k 80 --no-official > "$OUT/fetch.txt" 2>&1
          rc1=$?
          python pokemon-agent/tools/summarize_episodes.py \
            --outdir "$OUT" > "$OUT/summarize.txt" 2>&1
          rc2=$?

          echo "---- fetch tail ----"; tail -30 "$OUT/fetch.txt" 2>/dev/null
          echo "---- summarize ----"; cat "$OUT/summarize.txt" 2>/dev/null
          [ $rc1 -ne 0 ] && { echo "FETCH FAILED rc=$rc1"; exit 1; }
          [ $rc2 -ne 0 ] && { echo "SUMMARIZE FAILED rc=$rc2"; exit 1; }

      - name: Commit back (small files only)
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          find pokemon-agent/kaggle_results/our_replays -type f -size +5M -delete || true
          git add -A pokemon-agent/kaggle_results/our_replays/ || true
          { echo "== commit-back state $(date -u)"; ls -la pokemon-agent/kaggle_results/our_replays/ | head -40
            echo "== git status:"; git status --porcelain | head -20
            echo "== ignore check:"; git check-ignore -v pokemon-agent/kaggle_results/our_replays/fetch.txt 2>&1 || echo "not ignored"
          } > pokemon-agent/kaggle_results/our_replays/commit_back_state.txt 2>&1
          git add -f pokemon-agent/kaggle_results/our_replays/*.txt 2>/dev/null || true
          if [ -n "$(git status --porcelain pokemon-agent/kaggle_results/our_replays)" ]; then
            git commit -m "chore(kaggle): our replays [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
