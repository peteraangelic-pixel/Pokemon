name: rust-build

on:
  push:
    branches: [arena/c87f7a48-pokemon]
    paths:
      - "pokemon-agent/rust/**"
      - ".github/workflows/rust-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Build rust binaries
        run: |
          set -eo pipefail
          cd pokemon-agent/rust
          echo "=== cargo build ===" | tee build.log
          cargo build --release --bin rust_gauntlet --bin rust_full --bin gauntlet_rust --bin search_deck_rust --bin analyze_playstyle_rust --bin evolve_tempo 2>&1 | tee -a build.log
          echo "=== ls ===" | tee -a build.log
          ls -lh target/release/rust_gauntlet target/release/rust_full target/release/gauntlet_rust target/release/search_deck_rust target/release/analyze_playstyle_rust 2>&1 | tee -a build.log
          ./target/release/rust_gauntlet --help 2>&1 | tee -a build.log
          ./target/release/rust_full --help 2>&1 | tee -a build.log || true
          ./target/release/gauntlet_rust --help 2>&1 | tee -a build.log
          ./target/release/search_deck_rust --help 2>&1 | tee -a build.log || true
          ./target/release/analyze_playstyle_rust --help 2>&1 | tee -a build.log || true
          mkdir -p bin
          cp target/release/rust_gauntlet bin/rust_gauntlet || true
          cp target/release/rust_full bin/rust_full || true
          cp target/release/gauntlet_rust bin/gauntlet_rust || true
          cp target/release/search_deck_rust bin/search_deck_rust || true
          cp target/release/analyze_playstyle_rust bin/analyze_playstyle_rust || true
          chmod +x bin/*
      - name: Commit binaries and logs
        if: always()
        run: |
          set -eo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          mkdir -p pokemon-agent/rust/bin
          if [ -f pokemon-agent/rust/build.log ]; then
            cp pokemon-agent/rust/build.log pokemon-agent/rust/bin/build.log || true
            cp pokemon-agent/rust/build.log pokemon-agent/rust/build.log.txt || true
          fi
          git add -f pokemon-agent/rust/bin/ || true
          git add -f pokemon-agent/rust/build.log.txt || true
          git diff --cached --stat || true
          cat pokemon-agent/rust/build.log | tail -n 200 || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(rust): commit rust binaries + build.log [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
