name: rust-build

on:
  push:
    branches: [arena/c87f7a48-pokemon]
    paths:
      - "pokemon-agent/rust/**"
      - ".github/workflows/rust-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Build rust_gauntlet
        run: |
          cd pokemon-agent/rust
          cargo build --release
          ls -lh target/release/rust_gauntlet
          ./target/release/rust_gauntlet --help
          mkdir -p bin
          cp target/release/rust_gauntlet bin/rust_gauntlet
          chmod +x bin/rust_gauntlet
      - name: Commit binary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pokemon-agent/rust/bin/rust_gauntlet
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(rust): commit rust_gauntlet binary [skip ci]"
            git push origin ${{ github.ref_name }}
          fi
