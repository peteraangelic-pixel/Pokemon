name: rl-bc-rust

on:
  push:
    branches: ["arena/c87f7a48-pokemon", "arena/a450b00f-pokemon"]
    paths:
      - "pokemon-agent/kaggle_results/rl_bc_rust.trigger"
      - "pokemon-agent/rust/**"
      - "pokemon-agent/tools/duel.py"
      - ".github/workflows/rl_bc_rust.yml"
  workflow_dispatch:
    inputs:
      games:
        description: "Games to generate"
        default: "200"
        required: false
      jobs:
        description: "Rayon threads"
        default: "1"
        required: false
      epochs:
        description: "Training epochs"
        default: "2"
        required: false

permissions:
  contents: write

jobs:
  bc-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - name: Debug rust files
        run: |
          ls -R pokemon-agent/rust/src/ | head -100
          cat pokemon-agent/rust/Cargo.toml
          ls -lh pokemon-agent/rust/src/engine.rs pokemon-agent/assets/card_index.json
          ls pokemon-agent/decks/ | head -20

      - name: Install Python deps
        run: |
          cd pokemon-agent
          python -m venv .venv
          .venv/bin/pip install --quiet kaggle-environments jax jaxlib numpy
          ls -lh .venv/lib/python3.11/site-packages/kaggle_environments/envs/cabt/cg/libcg.so

      - name: Build Rust BC generator
        run: |
          cd pokemon-agent/rust
          cargo build --release --bin gen_bc_data_rust 2>&1 | tee build_bc.log
          ls -lh target/release/gen_bc_data_rust
          ./target/release/gen_bc_data_rust --help 2>&1 | tee -a build_bc.log

      - name: Generate BC data (Rust+Rayon)
        id: gen
        continue-on-error: true
        run: |
          cd pokemon-agent
          mkdir -p kaggle_results
          TRIGGER=$(cat kaggle_results/rl_bc_rust.trigger 2>/dev/null || echo "")
          echo "Trigger file: $TRIGGER"
          GAMES_INPUT="${{ inputs.games || '' }}"
          if [ -n "$GAMES_INPUT" ]; then
            GAMES="$GAMES_INPUT"
          else
            GAMES_FROM_FILE=$(echo "$TRIGGER" | grep -oE 'games=[0-9]+' | cut -d= -f2 | head -1)
            if [ -n "$GAMES_FROM_FILE" ]; then
              GAMES="$GAMES_FROM_FILE"
            else
              GAMES=200
            fi
          fi
          JOBS_INPUT="${{ inputs.jobs || '' }}"
          if [ -n "$JOBS_INPUT" ]; then JOBS="$JOBS_INPUT"; else JOBS=1; fi
          echo "Using GAMES=$GAMES JOBS=$JOBS"
          ./rust/target/release/gen_bc_data_rust \
            --card-index assets/card_index.json \
            --deck-pool-dir decks \
            --out kaggle_results/bc_data_rust.npz \
            --games $GAMES \
            --jobs $JOBS \
            --lib-path .venv/lib/python3.11/site-packages/kaggle_environments/envs/cabt/cg/libcg.so \
            --seed 7 2>&1 | tee kaggle_results/bc_rust.log
          echo "Exit code: ${PIPESTATUS[0]}" | tee -a kaggle_results/bc_rust.log
          ls -lh kaggle_results/bc_data_rust.npz || echo "npz not found" | tee -a kaggle_results/bc_rust.log
          cat kaggle_results/bc_rust.log | tail -100

      - name: Show logs
        if: always()
        run: |
          cat pokemon-agent/rust/build_bc.log | tail -100 || true
          cat pokemon-agent/kaggle_results/bc_rust.log | tail -200 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bc-rust-logs-${{ github.run_id }}
          path: |
            pokemon-agent/rust/build_bc.log
            pokemon-agent/kaggle_results/bc_rust.log

      - name: Train policy (JAX)
        if: always() && hashFiles('pokemon-agent/kaggle_results/bc_data_rust.npz') != ''
        run: |
          cd pokemon-agent
          TRIGGER=$(cat kaggle_results/rl_bc_rust.trigger 2>/dev/null || echo "")
          EPOCHS_INPUT="${{ inputs.epochs || '' }}"
          if [ -n "$EPOCHS_INPUT" ]; then EPOCHS="$EPOCHS_INPUT"; else EPOCHS_FROM_FILE=$(echo "$TRIGGER" | grep -oE 'epochs=[0-9]+' | cut -d= -f2 | head -1); if [ -n "$EPOCHS_FROM_FILE" ]; then EPOCHS="$EPOCHS_FROM_FILE"; else EPOCHS=2; fi; fi
          echo "Training for $EPOCHS epochs"
          .venv/bin/python tools/train_policy.py --data kaggle_results/bc_data_rust.npz --out kaggle_results/policy_rust.npz --epochs $EPOCHS --bs 512 --lr 1e-3 2>&1 | tee kaggle_results/train_rust.log
          ls -lh kaggle_results/policy_rust.npz

      - name: Commit results (always)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p pokemon-agent/kaggle_results
          cp pokemon-agent/rust/build_bc.log pokemon-agent/kaggle_results/build_bc.log 2>/dev/null || true
          git add -f pokemon-agent/kaggle_results/build_bc.log pokemon-agent/kaggle_results/bc_rust.log pokemon-agent/kaggle_results/train_rust.log pokemon-agent/kaggle_results/policy_rust.npz pokemon-agent/kaggle_results/bc_data_rust.npz 2>/dev/null || true
          git diff --cached --stat || true
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "rl bc rust logs ${{ github.run_id }} [skip ci]"; git push origin "HEAD:${GITHUB_REF_NAME}" || true; fi
