name: Get Main Notebook Output

on:
  workflow_dispatch:
  push:
    branches: ["arena/7911f950-pokemon"]
    paths:
      - "arc-agi-3/llm-agent/notebook/.get-main.trigger"

jobs:
  get:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install Kaggle CLI
        run: pip install kaggle
      
      - name: Configure Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p .kaggle
          printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]' > .kaggle/access_token
          chmod 600 .kaggle/access_token
      
      - name: Get main notebook output
        run: |
          KG="env KAGGLE_API_TOKEN=$(cat .kaggle/access_token) kaggle"
          KERNEL_ID="petersharps/arc-agi-3-llm-agent-qwen3-6-27b"
          
          echo "=== Kernel status ==="
          $KG kernels status "$KERNEL_ID" 2>&1 | tee main-output.log
          
          echo -e "\n=== Downloading output ==="
          mkdir -p /tmp/main-out
          $KG kernels output "$KERNEL_ID" -p /tmp/main-out/ 2>&1 | tee -a main-output.log || echo "Exit: $?"
          
          echo -e "\n=== Files ==="
          find /tmp/main-out -type f -exec ls -la {} \; | tee -a main-output.log
          
          echo -e "\n=== Contents ==="
          for f in $(find /tmp/main-out -type f); do
            echo "--- $f ($(wc -c < "$f") bytes) ---"
            cat "$f" | head -300
            echo ""
          done | tee -a main-output.log
      
      - name: Announce
        if: always()
        run: |
          python3 - <<'PY'
          import os
          body = open('main-output.log').read() if os.path.exists('main-output.log') else '(no log)'
          body = body.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(f"::notice title=Main Notebook Output::{body[:4500]}")
          PY
