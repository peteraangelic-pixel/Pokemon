name: NASK surface CI

# Compile + unit tests + offline selftest. Never touches the network.
on:
  push:
    branches: [arena/7911f950-pokemon]
    paths:
      - "nask/tools/surface/**"
      - ".github/workflows/surface-nask-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  MANIFEST: nask/tools/surface/Cargo.toml
  BIN: nask/tools/surface/target/release/surface

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests (no network)
        run: |
          set +e
          cargo test --manifest-path "$MANIFEST" > /tmp/test.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            python3 - <<'PYLOG'
          import re
          lines = open("/tmp/test.log", errors="replace").read().splitlines()
          keep = [l for l in lines if re.search(r"^error(\[|:)|panicked at|assertion|^  --> |^help: ", l)][:12]
          for l in keep:
              print(f"::error title=cargo::{l.strip()[:300]}")
          PYLOG
          fi
          exit $code
      - name: Build
        run: cargo build --release --manifest-path "$MANIFEST"
      - name: Offline selftest (guard, limiter, analyzer)
        run: ./"$BIN" selftest
      - name: Scope table
        run: ./"$BIN" scope
