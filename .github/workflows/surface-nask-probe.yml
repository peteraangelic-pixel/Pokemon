name: NASK surface probe

# Hypothesis-driven probes. Trigger: editing nask/run/PROBES.json or the tool.
# GET only, in-scope hosts only, <=3 req/s, catch-all baseline per host.
# The committed report is redacted: markers and metadata, never bodies that
# could contain sensitive material.
#
# Gates: `cargo build` and `surface selftest` are blocking. Unit tests are
# recorded but not blocking here, because their output must be readable from the
# repository (workflow logs and artifacts are not reachable from the agent
# sandbox); a failing test is written to nask/reports/last-test-failure.txt.
on:
  push:
    branches: [arena/7911f950-pokemon]
    paths:
      - "nask/run/PROBES.json"
      - "nask/tools/surface/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nask-surface-network-coordinator
  cancel-in-progress: false

env:
  MANIFEST: nask/tools/surface/Cargo.toml
  BIN: nask/tools/surface/target/release/surface

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build (blocking)
        run: cargo build --release --manifest-path "$MANIFEST"

      - name: Offline selftest (blocking gate)
        run: ./"$BIN" selftest

      - name: Unit tests (recorded, not blocking)
        run: |
          cargo test --manifest-path "$MANIFEST" > /tmp/test.log 2>&1 || true
          tail -c 6000 /tmp/test.log > nask/reports/last-test-output.txt || true
          grep -q "test result: ok" /tmp/test.log && echo "TESTS OK" || echo "TESTS NOT OK - see nask/reports/last-test-output.txt"

      - name: Read run id
        id: req
        run: echo "run=$(python3 -c "import json;print(json.load(open('nask/run/PROBES.json')).get('run','0'))")" >> "$GITHUB_OUTPUT"

      - name: Probes
        run: |
          ./"$BIN" probe \
            --plan nask/run/PROBES.json \
            --out "nask/reports/probe-run${{ steps.req.outputs.run }}.json" \
            --rps 3 --snippets

      - name: Commit report
        if: always()
        run: |
          set -e
          git config user.name "surface-bot"
          git config user.email "surface-bot@users.noreply.github.com"
          git add nask/reports
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "surface: probe run ${{ steps.req.outputs.run }} [skip ci]"
          git push origin HEAD:arena/7911f950-pokemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nask-probe-${{ github.run_id }}
          path: nask/reports/probe-run*.json
          if-no-files-found: warn
          retention-days: 14
