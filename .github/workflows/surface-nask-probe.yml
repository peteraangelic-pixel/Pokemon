name: NASK surface probe

# Hypothesis-driven probes. Trigger: editing nask/run/PROBES.json.
# GET only, in-scope hosts only, <=3 req/s, catch-all baseline per host.
# The committed report is redacted: markers and metadata, never bodies that
# could contain sensitive material.
on:
  push:
    branches: [arena/7911f950-pokemon]
    paths:
      - "nask/run/PROBES.json"
      - "nask/tools/surface/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nask-surface-network-coordinator
  cancel-in-progress: false

env:
  MANIFEST: nask/tools/surface/Cargo.toml
  BIN: nask/tools/surface/target/release/surface

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests gate the network run
        run: |
          set +e
          cargo test --manifest-path "$MANIFEST" > /tmp/test.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            python3 - <<'PYLOG'
          import re
          lines = open("/tmp/test.log", errors="replace").read().splitlines()
          keep = [l for l in lines if re.search(r"^error(\[|:)|panicked at|assertion|^  --> |^help: ", l)][:12]
          for l in keep:
              print(f"::error title=cargo::{l.strip()[:300]}")
          PYLOG
          fi
          exit $code
      - name: Build
        run: cargo build --release --manifest-path "$MANIFEST"
      - name: Offline selftest gate
        run: ./"$BIN" selftest
      - name: Read run id
        id: req
        run: echo "run=$(python3 -c "import json;print(json.load(open('nask/run/PROBES.json')).get('run','0'))")" >> "$GITHUB_OUTPUT"
      - name: Probes
        run: |
          ./"$BIN" probe \
            --plan nask/run/PROBES.json \
            --out "nask/out/probe-run${{ steps.req.outputs.run }}.json" \
            --rps 3 --snippets
      - name: Commit redacted report
        if: always()
        run: |
          set -e
          RUN="${{ steps.req.outputs.run }}"
          mkdir -p nask/reports
          if [ -f "nask/out/probe-run${RUN}.json" ]; then
            cp "nask/out/probe-run${RUN}.json" "nask/reports/probe-run${RUN}.json"
          fi
          git config user.name "surface-bot"
          git config user.email "surface-bot@users.noreply.github.com"
          git add nask/reports
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "surface: probe run ${RUN} [skip ci]"
          git push origin HEAD:arena/7911f950-pokemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nask-probe-${{ github.run_id }}
          path: nask/out/probe-run*.json
          if-no-files-found: warn
          retention-days: 14
