name: Inspect Submission

on:
  workflow_dispatch:
  push:
    branches: ["arena/7911f950-pokemon"]
    paths:
      - "arc-agi-3/llm-agent/notebook/.inspect.trigger"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install deps
        run: pip install kaggle pandas pyarrow
      
      - name: Configure Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p .kaggle
          printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]' > .kaggle/access_token
          chmod 600 .kaggle/access_token
      
      - name: Download and inspect
        run: |
          export KAGGLE_API_TOKEN=$(cat .kaggle/access_token)
          
          mkdir -p /tmp/kernel-output
          kaggle kernels output "petersharps/arc-agi-3-llm-agent-qwen2-5-7b-nf4-for-t4" -p /tmp/kernel-output 2>&1
          
          echo "=== Files in output ==="
          ls -lah /tmp/kernel-output/
          
          echo -e "\n=== Log file (last 100 lines) ==="
          cat /tmp/kernel-output/*.log 2>/dev/null | tail -100 || echo "(no log)"
          
          if [ -f /tmp/kernel-output/submission.parquet ]; then
            echo -e "\n=== submission.parquet size ==="
            ls -lh /tmp/kernel-output/submission.parquet
            
            python3 - <<'PY'
            import pandas as pd
            df = pd.read_parquet('/tmp/kernel-output/submission.parquet')
            print(f"Shape: {df.shape}")
            print(f"Columns: {list(df.columns)}")
            print(f"\nFirst 10 rows:")
            print(df.head(10).to_string())
            print(f"\nData types:")
            print(df.dtypes)
            PY
          else
            echo "submission.parquet NOT FOUND"
          fi
      
      - name: Announce
        if: always()
        run: |
          python3 - <<'PY'
          import subprocess
          
          result = subprocess.run(
              ["bash", "-c", "ls -lah /tmp/kernel-output/ 2>&1; echo '---'; cat /tmp/kernel-output/*.log 2>/dev/null | tail -50"],
              capture_output=True, text=True
          )
          body = result.stdout + result.stderr
          
          if __import__('os').path.exists('/tmp/kernel-output/submission.parquet'):
              result2 = subprocess.run(
                  ["python3", "-c", "import pandas as pd; df = pd.read_parquet('/tmp/kernel-output/submission.parquet'); print(f'Shape: {df.shape}'); print(f'Columns: {list(df.columns)}'); print(df.head(10).to_string())"],
                  capture_output=True, text=True
              )
              body += '\n\n=== Parquet ===\n' + result2.stdout + result2.stderr
          
          body = body.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(f"::notice title=Submission Inspect::{body[:4500]}")
          PY
