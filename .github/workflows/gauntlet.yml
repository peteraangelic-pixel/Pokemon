name: gauntlet-quick-test

on:
  push:
    branches: ["arena/a450b00f-pokemon", "arena/c87f7a48-pokemon"]
    paths:
      - "pokemon-agent/agents/*.py"
      - "pokemon-agent/decks/*.csv"
      - "pokemon-agent/deck.csv"
      - "pokemon-agent/rust/**"
      - "pokemon-agent/tools/gauntlet_live.py"
      - ".github/workflows/gauntlet.yml"
  workflow_dispatch:
    inputs:
      agent:
        description: "Agent to test (path from repo root)"
        default: "pokemon-agent/agents/v78_rl.py"
        required: false
      deck:
        description: "Deck to test"
        default: "pokemon-agent/decks/v57_trolley34w.csv"
        required: false
      games:
        description: "Games per matchup"
        default: "20"
        required: false

permissions:
  contents: write

jobs:
  gauntlet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python deps
        run: |
          cd pokemon-agent
          python -m venv .venv
          .venv/bin/pip install --quiet kaggle-environments

      - name: Build rust_gauntlet
        run: |
          cd pokemon-agent/rust
          set -eo pipefail
          cargo build --release --bin rust_gauntlet 2>&1 | tee build.log
          mkdir -p ../rust/bin
          cp target/release/rust_gauntlet ../rust/bin/rust_gauntlet
          ls -lh ../rust/bin/

      - name: Run gauntlet vs top7_live and top30_live
        env:
          AGENT: ${{ inputs.agent || 'pokemon-agent/agents/v78_rl.py' }}
          DECK: ${{ inputs.deck || 'pokemon-agent/decks/v57_trolley34w.csv' }}
          GAMES: ${{ inputs.games || '20' }}
        run: |
          cd pokemon-agent
          mkdir -p kaggle_results/gauntlet
          echo "Testing $AGENT vs top7_live with $DECK $GAMES games" | tee kaggle_results/gauntlet/latest.log
          .venv/bin/python tools/gauntlet_live.py --our-deck $DECK --agent $AGENT --live-dir decks/top7_live --games $GAMES 2>&1 | tee -a kaggle_results/gauntlet/latest.log | tail -n 100
          echo "--- Rust gauntlet top7 ---" | tee -a kaggle_results/gauntlet/latest.log
          timeout 300 ./rust/bin/rust_gauntlet --our-deck $DECK --agent $AGENT --live-dir decks/top7_live --games $GAMES 2>&1 | tee -a kaggle_results/gauntlet/latest.log | tail -n 100
          echo "--- Rust gauntlet top30 ---" | tee -a kaggle_results/gauntlet/latest.log
          timeout 300 ./rust/bin/rust_gauntlet --our-deck $DECK --agent $AGENT --live-dir decks/top30_live --games 5 2>&1 | tee -a kaggle_results/gauntlet/latest.log | tail -n 100
          echo "--- vs v67 and v76 ---" | tee -a kaggle_results/gauntlet/latest.log
          .venv/bin/python tools/gauntlet_ffi.py --agent $AGENT --our-deck $DECK --opp-dir decks/top7_live --games 2 2>&1 | tail -n 20 | tee -a kaggle_results/gauntlet/latest.log || true

      - name: Commit gauntlet log
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          mkdir -p pokemon-agent/kaggle_results/gauntlet
          cp pokemon-agent/kaggle_results/gauntlet/latest.log pokemon-agent/kaggle_results/gauntlet/${{ github.run_id }}.log || true
          git add -f pokemon-agent/kaggle_results/gauntlet/ || true
          if git diff --cached --quiet; then echo "no log"; else git commit -m "gauntlet log ${{ github.run_id }} for ${{ inputs.agent || 'v78_rl' }} [skip ci]"; git push origin "HEAD:${GITHUB_REF_NAME}" || true; fi
