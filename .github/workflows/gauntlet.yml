name: gauntlet-quick-test

on:
  push:
    branches: ["arena/c87f7a48-pokemon"]
    paths:
      - "pokemon-agent/agents/*.py"
      - "pokemon-agent/decks/*.csv"
      - "pokemon-agent/deck.csv"
      - "pokemon-agent/rust/**"
      - "pokemon-agent/tools/gauntlet_live.py"
      - ".github/workflows/gauntlet.yml"
  workflow_dispatch:
    inputs:
      agent:
        description: "Agent to test (path from repo root)"
        default: "pokemon-agent/agents/main_heuristic_v11e.py"
        required: false
      deck:
        description: "Deck to test"
        default: "pokemon-agent/decks/v10_34_sig4.csv"
        required: false
      games:
        description: "Games per matchup"
        default: "2"
        required: false

permissions:
  contents: read

jobs:
  gauntlet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install Python deps
        run: |
          cd pokemon-agent
          python -m venv .venv
          .venv/bin/pip install --quiet -r requirements.txt 2>/dev/null || .venv/bin/pip install --quiet kaggle-environments

      - name: Build rust_gauntlet
        run: |
          cd pokemon-agent/rust
          cargo build --release --locked
          ls -lh target/release/rust_gauntlet || ls -lh ../rust/bin/rust_gauntlet || echo "built"
          mkdir -p ../rust/bin
          cp target/release/rust_gauntlet ../rust/bin/rust_gauntlet || cp target/release/rust-gauntlet ../rust/bin/rust_gauntlet || true
          ls -lh ../rust/bin/

      - name: Run gauntlet vs top7_live
        env:
          AGENT: ${{ inputs.agent || 'pokemon-agent/agents/main_heuristic_v11e.py' }}
          DECK: ${{ inputs.deck || 'pokemon-agent/decks/v10_34_sig4.csv' }}
          GAMES: ${{ inputs.games || '2' }}
        run: |
          cd pokemon-agent
          echo "Testing $AGENT vs top7_live with $DECK $GAMES games"
          .venv/bin/python tools/gauntlet_live.py --our-deck $DECK --agent $AGENT --live-dir decks/top7_live --games $GAMES 2>&1 | tail -n 50
          echo "--- Rust gauntlet ---"
          timeout 180 ./rust/bin/rust_gauntlet --our-deck $DECK --agent $AGENT --live-dir decks/top7_live --games $GAMES 2>&1 | tail -n 50

      - name: Run vs walls
        env:
          AGENT: ${{ inputs.agent || 'pokemon-agent/agents/main_heuristic_v11e.py' }}
          DECK: ${{ inputs.deck || 'pokemon-agent/decks/v10_34_sig4.csv' }}
        run: |
          cd pokemon-agent
          .venv/bin/python tools/gauntlet_live.py --our-deck $DECK --agent $AGENT --live-dir decks/top7_live --games 2 --include-archetypes --only crustle_wall,sylveon_safeguard 2>&1 | tail -n 20
