name: ARC3 ops

# One workflow for every Kaggle operation (replaces the ~25 ad-hoc workflows).
#
# Fire:  edit arc-agi-3/duck/ops/request.json  ({"id","op","args"}) and push,
#        or press "Run workflow" in the GitHub UI.
# Read:  `gh run view <id>` (annotation with SUMMARY.md) or `git pull` and open
#        arc-agi-3/duck/ops/results/<id>-<op>/SUMMARY.md
#
# The op logic lives in arc-agi-3/duck/ops/kaggle_ops.py (testable locally).
# `submit` is guarded there: COMPLETE save run + smoke marker + limit left.

on:
  workflow_dispatch:
  push:
    branches: ["arena/98ddb59f-pokemon"]
    paths:
      - "arc-agi-3/duck/ops/request.json"

permissions:
  contents: write

concurrency:
  group: arc3-ops-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  op:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: pip install --quiet --upgrade "kaggle>=2.0"

      - name: Build notebook (if a push op targets a generated dir)
        run: |
          OP=$(python3 -c "import json;print(json.load(open('arc-agi-3/duck/ops/request.json'))['op'])")
          if [ "$OP" = "push" ] && [ -f arc-agi-3/duck/notebook/build.py ]; then
            python3 arc-agi-3/duck/notebook/build.py --request arc-agi-3/duck/ops/request.json
            mkdir -p arc-agi-3/duck/ops/results/_build && cp arc-agi-3/duck/notebook/out/BUILD_INFO.json arc-agi-3/duck/ops/results/_build/last.json
          fi

      - name: Run op
        id: run
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set +e
          python3 arc-agi-3/duck/ops/kaggle_ops.py arc-agi-3/duck/ops/request.json
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Annotate summary
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib
          res = sorted(pathlib.Path("arc-agi-3/duck/ops/results").glob("*/SUMMARY.md"), key=lambda p: p.stat().st_mtime)
          if not res:
              print("::warning title=ARC3 ops::no summary produced"); raise SystemExit
          body = res[-1].read_text()
          # annotations are capped (~4 KB); split into several notices
          chunks = [body[i:i + 3500] for i in range(0, min(len(body), 3500 * 6), 3500)]
          for n, c in enumerate(chunks, 1):
              c = c.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::notice title=ARC3 ops {n}/{len(chunks)}::{c}")
          PY

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add arc-agi-3/duck/ops/results || true
          if [ -n "$(git status --porcelain arc-agi-3/duck/ops/results)" ]; then
            git commit -q -m "ops: results $(date -u +%Y%m%dT%H%M%SZ) [skip ci]"
            for i in 1 2 3 4 5; do
              git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep 5
            done
          fi

      - name: Fail if op failed
        if: steps.run.outputs.code != '0'
        run: exit 1
