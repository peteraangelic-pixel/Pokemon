name: kaggle-submit

on:
  workflow_dispatch:
    inputs:
      bundle:
        description: "Bundle to submit"
        default: "phase1_tuned_80.tar.gz"
        required: false
      message:
        description: "Submission message"
        default: "Gen5 80.0%->74.9% stable"
        required: false

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet kaggle
      - name: Configure Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          if [ -n "$KAGGLE_API_TOKEN" ]; then
            printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]' > ~/.kaggle/access_token
            chmod 600 ~/.kaggle/access_token
          else
            printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
            chmod 600 ~/.kaggle/kaggle.json
          fi
      - name: Submit bundle
        env:
          BUNDLE: ${{ inputs.bundle }}
          MESSAGE: ${{ inputs.message }}
        run: |
          cd pokemon-agent
          kaggle competitions submit -c the-pokemon-company-ptcg-ai-battle-challenge-playground -f "bundles/$BUNDLE" -m "$MESSAGE" 2>&1 | tee submit.log
