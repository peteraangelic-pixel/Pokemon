name: kaggle-submit

on:
  workflow_dispatch:
    inputs:
      bundle:
        description: "Bundle to submit"
        default: "phase1_tuned_gen8_powerglass.tar.gz"
        required: false
      message:
        description: "Submission message"
        default: "Gen8 powerglass 29W Powerglass x2 - 0.650 vs mirror_losses The Prad K 1.000 vs 0.500 - should improve vs Powerglass mirrors"
        required: false
  push:
    branches: ["arena/c87f7a48-pokemon"]
    paths:
      - "pokemon-agent/bundles/phase1_tuned_80.tar.gz"
      - "pokemon-agent/bundles/phase1_tuned_80.trigger"
      - "pokemon-agent/bundles/phase1_tuned_gen8_v2.tar.gz"
      - "pokemon-agent/bundles/phase1_tuned_gen8_v2.trigger"
      - "pokemon-agent/bundles/phase1_tuned_gen8_powerglass.tar.gz"
      - "pokemon-agent/bundles/phase1_tuned_gen8_powerglass.trigger"
      - "pokemon-agent/bundles/phase1_tuned_gen8_mirror.tar.gz"
      - "pokemon-agent/bundles/phase1_tuned_gen8_mirror.trigger"
      - ".github/workflows/kaggle_submit.yml"

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install kaggle
        run: pip install --quiet kaggle

      - name: Configure Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          if [ -n "$KAGGLE_API_TOKEN" ]; then
            printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]' > ~/.kaggle/access_token
            chmod 600 ~/.kaggle/access_token
            echo "Using KAGGLE_API_TOKEN for petersharps"
            cat ~/.kaggle/access_token | head -c 20
            echo ""
          elif [ -n "$KAGGLE_USERNAME" ] && [ -n "$KAGGLE_KEY" ]; then
            printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
            chmod 600 ~/.kaggle/kaggle.json
            echo "Using USERNAME/KEY"
          else
            echo "No Kaggle credentials"
            exit 1
          fi

      - name: Submit bundle
        env:
          BUNDLE: ${{ inputs.bundle || 'phase1_tuned_gen8_powerglass.tar.gz' }}
          MESSAGE: ${{ inputs.message || 'Gen8 powerglass 29W Powerglass x2 - 0.650 vs mirror_losses The Prad K 1.000 vs 0.500 - fixes Powerglass mirrors' }}
        run: |
          cd pokemon-agent
          BUNDLE_PATH="bundles/$BUNDLE"
          ls -lh bundles/ | tail -15
          echo "Submitting $BUNDLE_PATH to the-pokemon-company-ptcg-ai-battle-challenge-playground"
          echo "Message: $MESSAGE"
          echo "Account: $(kaggle --version)"
          kaggle competitions submit -c the-pokemon-company-ptcg-ai-battle-challenge-playground -f "$BUNDLE_PATH" -m "$MESSAGE" 2>&1 | tee submit.log
          cat submit.log
          echo "Submitted as petersharps!"
