name: kaggle-submit

on:
  workflow_dispatch:
    inputs:
      bundle:
        description: "Bundle to submit (z bundles/)"
        default: "phase1_tuned_v10_34_sig4.tar.gz"
        required: false
      message:
        description: "Submission message"
        default: "v10 34W Signal4 Boss4 Waitress2 Belt1 Pad1 Night1 - 0.932 vs top7_live 0.777 weighted BEST - only 2 last active!"
        required: false

# USUNIĘTE auto-trigger na push bundles – tylko ręczny dispatch!
# Powód: tylko 2 ostatnie submissiony są aktywne w finale, auto-push zapychał sloty 5/dzień kiepskimi wersjami

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install kaggle
        run: pip install --quiet kaggle

      - name: Configure Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          if [ -n "$KAGGLE_API_TOKEN" ]; then
            printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]' > ~/.kaggle/access_token
            chmod 600 ~/.kaggle/access_token
            echo "Using KAGGLE_API_TOKEN"
          elif [ -n "$KAGGLE_USERNAME" ] && [ -n "$KAGGLE_KEY" ]; then
            printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
            chmod 600 ~/.kaggle/kaggle.json
          else
            echo "No Kaggle credentials"
            exit 1
          fi

      - name: Submit bundle
        env:
          BUNDLE: ${{ inputs.bundle }}
          MESSAGE: ${{ inputs.message }}
        run: |
          cd pokemon-agent
          BUNDLE_PATH="bundles/$BUNDLE"
          ls -lh bundles/ | tail -20
          echo "Submitting $BUNDLE_PATH"
          echo "Message: $MESSAGE"
          kaggle competitions submit -c the-pokemon-company-ptcg-ai-battle-challenge-playground -f "$BUNDLE_PATH" -m "$MESSAGE" 2>&1 | tee submit.log
          cat submit.log
