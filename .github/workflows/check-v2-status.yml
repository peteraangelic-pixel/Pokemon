name: Check v2 Status

on:
  workflow_dispatch:
  push:
    branches: ["arena/7911f950-pokemon"]
    paths:
      - "arc-agi-3/.check-v2.trigger"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install Kaggle CLI
        run: pip install kaggle
      
      - name: Configure Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p .kaggle
          printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]' > .kaggle/access_token
          chmod 600 .kaggle/access_token
      
      - name: Check submission
        run: |
          export KAGGLE_API_TOKEN=$(cat .kaggle/access_token)
          
          echo "=== Submission #57125322 ==="
          kaggle competitions submissions -c arc-prize-2026-arc-agi-3 --csv 2>&1 | grep "57125322" || echo "Not found"
      
      - name: Announce
        if: always()
        run: |
          python3 - <<'PY'
          import subprocess
          result = subprocess.run(
              ["bash", "-c", "KG=\"env KAGGLE_API_TOKEN=$(cat .kaggle/access_token) kaggle\"; $KG competitions submissions -c arc-prize-2026-arc-agi-3 --csv 2>&1 | grep 57125322 || echo 'Not found'"],
              capture_output=True, text=True, env={"KAGGLE_API_TOKEN": open(".kaggle/access_token").read().strip()}
          )
          body = result.stdout + result.stderr
          body = body.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(f"::notice title=v2 Status::{body[:1000]}")
          PY
