[package]
name = "rust_gauntlet"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rust_gauntlet"
path = "src/main.rs"

[[bin]]
name = "rust_full"
path = "src/bin/full.rs"

[dependencies]
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
libloading = "0.8"
