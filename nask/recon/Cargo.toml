[package]
name = "naskrecon"
version = "0.1.0"
edition = "2021"
description = "Rate-limited passive recon + probing for the NASK bug bounty (hack.cert.pl), hard-capped at 5 req/s per terms."

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1"
ureq = { version = "2", features = ["tls"] }
serde_json = "1"
regex = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
