[package]
name = "surface"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "surface"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rayon = "1.10"
regex = "1.10"
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
